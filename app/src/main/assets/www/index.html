<style>
:root{--bg:#272b36;--bar:#24272c;--bar2:#1e2227;--tx:#e8e8e8;--dim:#8b9099;--line:#34383f;--ac:#3b6fd6;--cur:#2e3446;--gut:#2a2e39;--menu:#23272c;--fs:14px;--lh:20px;--mono:"JetBrains Mono","Fira Code",Menlo,Consolas,"DejaVu Sans Mono",monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bar);color:var(--tx);font-family:system-ui,"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
svg{fill:currentColor;display:block}
#app{position:fixed;left:0;right:0;top:0;height:100%;display:flex;flex-direction:column;direction:ltr}
#top{height:48px;background:var(--bar);display:flex;align-items:center;padding:0 4px;flex:none}
.ib{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;border-radius:50%;flex:none;color:#fff}
.ib svg{width:24px;height:24px}
.ib:active{background:#ffffff22}
.ttl{flex:1;min-width:0;padding:0 8px}
.ttl b{display:block;font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.ttl small{display:block;font-size:12px;color:var(--dim);direction:rtl;text-align:left;line-height:1.2}
.pill{height:32px;border:0;border-radius:16px;padding:0 10px;margin:0 4px;background:linear-gradient(135deg,#ec4899,#8b5cf6);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;gap:5px;flex:none}
.pill svg{width:18px;height:18px}
.pill:active{filter:brightness(.85)}
#tabs{display:flex;height:34px;background:var(--bar);overflow-x:auto;flex:none;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-width:118px;max-width:190px;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:15px;border-top:2px solid transparent;color:#cfd2d8;position:relative}
.tab.on{border-top-color:var(--ac);background:var(--bar2);color:#fff}
.tab .dot{width:6px;height:6px;border-radius:50%;background:#ffd600;flex:none;visibility:hidden}
.tab.d .dot{visibility:visible}
.tab .fi{width:18px;height:18px;flex:none}
.tab .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .x{width:20px;height:20px;border:0;background:none;color:#fff;padding:0;flex:none}
.tab .x svg{width:20px;height:20px}
#findbar{background:var(--bar);padding:6px;display:none;flex-direction:column;gap:6px;flex:none;border-top:1px solid var(--line);direction:rtl}
#findbar.open{display:flex}
#findbar .r{display:flex;gap:6px;align-items:center}
#findbar input{flex:1;min-width:0;height:36px;border-radius:8px;border:1px solid var(--line);background:#1b1e22;color:#fff;padding:0 10px;font:inherit;font-size:15px;outline:0}
#findbar input:focus{border-color:var(--ac)}

#findbar button.s svg{width:20px;height:20px;margin:auto}
#findcount{font-size:12px;color:var(--dim);min-width:38px;text-align:center}
#ed{flex:1;display:flex;min-height:0;background:var(--bg);position:relative}
#gutter{flex:none;width:46px;background:var(--gut);overflow:hidden;color:#6f7685;font:var(--fs)/var(--lh) var(--mono);text-align:center;position:relative}
#gin{padding-top:8px;will-change:transform}
#gin>div{line-height:var(--lh)}
#wrap{position:relative;flex:1;min-width:0;overflow:hidden}
#cur{position:absolute;left:0;right:0;height:var(--lh);background:var(--cur);pointer-events:none}
.code{font:var(--fs)/var(--lh) var(--mono);letter-spacing:0;tab-size:2;-moz-tab-size:2;white-space:pre-wrap;overflow-wrap:anywhere;padding:8px 12px 160px 12px;margin:0;border:0;text-align:start;unicode-bidi:plaintext;font-variant-ligatures:none;word-spacing:0;text-rendering:auto}
#hl>div{min-height:var(--lh)}
#hl{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;pointer-events:none;color:#abb2bf}
#ta{position:absolute;left:0;top:0;width:100%;height:100%;background:transparent;color:transparent;caret-color:#fff;resize:none;outline:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-text-size-adjust:100%;border-radius:0}
#ta::selection{background:#3b6fd677}
.c-pn{color:#9aa3b2}.c-tg{color:#e06c75}.c-tu{color:#e5a06c}.c-at{color:#d19a66}.c-au{color:#c9b28a}.c-st{color:#98c379}
.c-cm{color:#7f848e;font-style:italic}.c-kw{color:#c678dd}.c-gl{color:#56b6c2}.c-fn{color:#61afef}.c-nm{color:#d19a66}
.c-pr{color:#56b6c2}.c-pu{color:#c9b28a}.c-vl{color:#98c379}.c-cl{color:#e5c07b}.c-id{color:#61afef}.c-ps{color:#c678dd}
#sugg{display:none;flex:none;background:#2d3139;overflow-x:auto;white-space:nowrap;padding:5px 6px;gap:6px;scrollbar-width:none;direction:rtl}
#sugg.open{display:flex;padding-right:68px}
#sugg::-webkit-scrollbar{display:none}
#sugg button{flex:none;border:0;background:#3a3f4a;color:#fff;border-radius:14px;padding:6px 14px;font-size:15px}
#sugg button:active{background:var(--ac)}
#sugg button small{display:block;font-size:10px;opacity:.6;direction:ltr;line-height:1;margin-top:1px}
#sugg button.sn{background:#3b3a66;border:1px solid #6f6bd6}
#sugg button.fw{background:#2f4a43}
#qt{flex:none;background:var(--bar);height:92px;position:relative;touch-action:manipulation}
.qr{display:none;height:46px}
.qr.on{display:flex}
.qb{flex:1;border:0;background:none;color:#fff;font-weight:600;font-size:14px;display:grid;place-items:center;position:relative;padding:0;min-width:0}
.qb svg{width:24px;height:24px}

.qb.act{color:#6ea0ff;background:#ffffff14}
.qb.dis{opacity:.4}

.qb.sn{font-size:13px;font-weight:600;direction:rtl;white-space:nowrap}
#svdot{position:absolute;top:3px;right:50%;margin-right:-18px;width:7px;height:7px;border-radius:50%;background:#ffd600;display:none}
#fab{position:absolute;right:16px;bottom:100px;width:46px;height:46px;border-radius:50%;border:2px solid #fff;background:#24272ccc;display:grid;place-items:center;color:#fff;z-index:5;box-shadow:0 2px 10px #0008}

#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#101215;color:#fff;border-radius:20px;padding:10px 18px;font-size:14px;z-index:99;display:none;max-width:90%;box-shadow:0 4px 16px #000a;align-items:center;gap:12px;direction:rtl}
#toast.show{display:flex}
#toast button{border:0;background:none;color:#6ea0ff;font-weight:700;font-size:14px;padding:0}
.shade{position:fixed;left:0;top:0;right:0;bottom:0;z-index:48;background:transparent}
.menu{position:fixed;background:var(--menu);border-radius:6px;box-shadow:0 8px 28px #000c;min-width:250px;max-width:90%;max-height:82%;overflow:auto;z-index:50;direction:ltr}
.mi{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 16px;min-height:52px;font-size:16px;text-align:left;width:100%;border:0;background:none;color:#fff}
.mi:active{background:#ffffff14}
.mi .lb{flex:1;min-width:0}
.mi small{display:block;color:var(--dim);font-size:13px;margin-top:1px}
.mi svg{width:22px;height:22px;flex:none}
.mi.off{color:#6d727b}
.mi.off small{color:#5a5f68}
.msep{height:1px;background:#3b4048;margin:0}
.chk{width:30px;height:30px;border:2px solid #cfd2d8;border-radius:6px;flex:none;display:grid;place-items:center}
.chk.on{background:var(--ac);border-color:var(--ac)}
.chk.on::after{content:"";width:8px;height:15px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
#drawer{position:fixed;left:0;top:0;right:0;bottom:0;z-index:40;display:none;direction:ltr}
#drawer.open{display:block}
#dscrim{position:absolute;left:0;top:0;right:0;bottom:0;background:#0009}

.ph{display:flex;align-items:center;padding:12px 14px 8px;gap:4px}

.plist{flex:1;overflow:auto;border-top:1px solid #353a41}

.grp{padding:10px 14px;font-size:14px;color:#9aa0a8;background:#1f2327;border-bottom:1px solid #2c3036;display:flex;justify-content:space-between;width:100%;border-left:0;border-right:0;border-top:0;text-align:right}
.ri{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid #2a2e33;width:100%;border-left:0;border-right:0;border-top:0;background:none;color:#fff;gap:10px}
.ri:active{background:#ffffff12}
.ri .a{font-size:16px;text-align:right}
.ri .e{font-family:var(--mono);font-size:13px;color:#98c379;direction:ltr;text-align:left}
.sr{padding:8px 14px;border-bottom:1px solid #2a2e33;font-size:13px;color:#cfd2d8;width:100%;border-left:0;border-right:0;border-top:0;background:none;text-align:right}
.sr b{color:#fff;font-size:15px;display:block;direction:ltr;text-align:right}
.sr code{display:block;direction:ltr;text-align:left;font-family:var(--mono);color:#9aa3b2;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:24px;color:var(--dim);text-align:center;font-size:14px}
.btnrow{display:flex;gap:8px;padding:8px 14px}
.btnrow button{flex:1;height:40px;border-radius:10px;border:0;background:#33373f;color:#fff;font-size:14px}
#dlg{position:fixed;left:0;top:0;right:0;bottom:0;z-index:70;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;direction:rtl}
#dlg.open{display:flex}

.card .acts{display:flex;gap:8px;justify-content:flex-start;margin-top:12px;flex-wrap:wrap}

.card .opt{display:flex;width:100%;align-items:center;gap:12px;padding:13px 10px;border:0;border-radius:10px;background:#2b2f36;color:#fff;margin:6px 0;text-align:right;font-size:16px}

.fld{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #31353c;font-size:15px}
.fld input[type=range]{width:50%}
.fld input[type=text]{width:50%;height:38px;margin:0;direction:ltr}
.sw{width:46px;height:26px;border-radius:13px;background:#4a4f58;position:relative;border:0;flex:none}

.sw.on::after{transform:translateX(20px)}
#pv{position:fixed;left:0;top:0;right:0;bottom:0;z-index:60;background:#fff;display:none;flex-direction:column;direction:ltr}

.bub{max-width:94%;padding:10px 13px;border-radius:14px;line-height:1.85;font-size:15px;word-break:break-word}
.bub.u{align-self:flex-start;background:var(--ac);color:#fff;border-bottom-right-radius:4px}
.bub.a{align-self:flex-end;background:#2d3139;border-bottom-left-radius:4px;width:94%}

.cb{background:#1b1e24;border-radius:10px;margin:8px 0;overflow:hidden}

.cbh span{display:flex;gap:6px}
.cbh button{border:0;border-radius:6px;background:#3a3f4a;color:#fff;padding:3px 9px;font-size:12px;font-family:system-ui,sans-serif}
.cb pre{margin:0;padding:10px;font:12.5px/1.6 var(--mono);color:#abb2bf;white-space:pre-wrap;overflow-wrap:anywhere;unicode-bidi:plaintext;text-align:start;tab-size:2}

#aic{display:flex;gap:6px;overflow-x:auto;padding:6px 8px;flex:none;scrollbar-width:none}

.typing{display:inline-block;animation:bl 1s infinite}

#aitabs{display:flex;gap:6px;padding:6px 8px;background:var(--bar2);flex:none}

#chatwrap{flex:1;min-height:0;display:none;flex-direction:column}

#course{flex:1;overflow:auto;padding:12px;display:none}

.bar{height:6px;border-radius:3px;background:#1b1e22;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ec4899,#8b5cf6);width:0}

COURSE.push({ id: 'html', t: 'مسار HTML', ic: '🧱', d: 'هيكل الصفحة: كل شي تشوفه بالموقع يبدأ من هنا', lessons: [
{ id: 'h1', t: 'أول صفحة: الوسوم', body: `<p><b>HTML</b> هي اللغة اللي تبني <b>هيكل</b> الصفحة: عناوين، فقرات، صور، أزرار. تكتب المحتوى داخل <b>وسوم</b>. الوسم له فتح <code>&lt;فقرة&gt;</code> وإغلاق <code>&lt;/فقرة&gt;</code> والمحتوى بينهم.</p>
<p>بنيرو تكتب أسماء الوسوم بالعربي، وعند التحويل تصير إنجليزي (<code>فقرة</code> ← <code>p</code>). الهيكل الأساسي لأي صفحة: <b>صفحة</b> (html) تحتوي <b>راس</b> (head) للإعدادات و<b>جسم</b> (body) للمحتوى المعروض.</p>
<ul><li><code>عنوان_الصفحة</code> = title: الاسم اللي يطلع بتبويب المتصفح.</li><li><code>ميتا ترميز="utf-8"</code> ضروري حتى تظهر العربي صح.</li></ul>`,
 html: `<!مستند html>
<صفحة لغة="ar" اتجاه="يمين">
<راس>
  <ميتا ترميز="utf-8">
  <ميتا اسم="منفذ_العرض" محتوى="width=device-width, initial-scale=1">
  <عنوان_الصفحة>صفحتي الاولى</عنوان_الصفحة>
</راس>
<جسم>
  <عنوان>مرحبا بالعالم</عنوان>
  <فقرة>هذي اول صفحة اسويها بنفسي.</فقرة>
</جسم>
</صفحة>`, full: true,

 q: { q: 'أي وسم يحتوي محتوى الصفحة المعروض؟', o: ['راس', 'جسم', 'ميتا'], a: 1 } },

{ id: 'h2', t: 'العناوين والفقرات والنص', body: `<p>عندك ست مستويات للعناوين: <code>عنوان</code> (h1 الأكبر) ثم <code>عنوان2</code> إلى <code>عنوان6</code>. استخدم عنوان واحد رئيسي بالصفحة.</p>
<ul><li><code>فقرة</code> = p لنص عادي.</li><li><code>عريض</code> = strong للتأكيد، <code>مائل</code> = em.</li><li><code>سطر_جديد</code> = br ينزل سطر، <code>خط</code> = hr خط فاصل.</li><li><code>نص</code> = span لتغليف كلمة وتنسيقها لاحقاً.</li></ul>`,
 html: `<عنوان>عنوان رئيسي</عنوان>
<عنوان2>عنوان فرعي</عنوان2>
<فقرة>هذا نص <عريض>مهم</عريض> وهذا <مائل>مائل</مائل>.<سطر_جديد>وهذا سطر جديد.</فقرة>
<خط>
<فقرة>كلمة <نص فئة="ملون">ملونة</نص> لاحقاً.</فقرة>`,

 q: { q: 'وش يسوي الوسم «سطر_جديد»؟', o: ['ينزل سطر جديد', 'يسوي عنوان', 'يرسم صورة'], a: 0 } },

{ id: 'h3', t: 'الروابط والصور', body: `<p>الرابط <code>رابط</code> (a) يحتاج الخاصية <code>وجهة</code> (href) وهي العنوان اللي ينتقل له. <code>هدف="جديدة"</code> يفتحه بتبويب جديد.</p>
<p>الصورة <code>صورة</code> (img) ما لها وسم إغلاق، وتحتاج <code>مصدر</code> (src) و<code>بديل</code> (alt) نص يوصف الصورة لمن ما تظهر أو لقارئ الشاشة.</p>
<p>الخصائص تكتبها داخل وسم الفتح بصيغة <code>اسم="قيمة"</code>.</p>`,

<فقرة معرف="تحت">وصلت!</فقرة>`,

{ id: 'h4', t: 'القوائم', body: `<p>قائمة بنقاط: <code>قائمة</code> (ul). قائمة مرقمة: <code>قائمة_مرقمة</code> (ol). كل عنصر بداخلها يكون <code>عنصر</code> (li).</p>
<p>تقدر تحط قائمة داخل عنصر قائمة ثانية فتصير متداخلة.</p>`,

<قائمة>

</قائمة>
<عنوان2>خطوات الشاي</عنوان2>
<قائمة_مرقمة>

{ id: 'h5', t: 'الجداول', body: `<p>الجدول <code>جدول</code> (table) يتكون من صفوف <code>صف</code> (tr). داخل الصف خلايا <code>خلية</code> (td)، والعناوين <code>راس_خلية</code> (th).</p>
<p>للتنظيم: <code>راس_الجدول</code> (thead) و<code>جسم_الجدول</code> (tbody). ولدمج خلايا استخدم <code>امتداد_اعمدة</code> (colspan).</p>`,
 html: `<جدول حدود="1">

{ id: 'h6', t: 'النماذج وحقول الإدخال', body: `<p>النموذج <code>نموذج</code> (form) يجمع حقول المستخدم. الحقل <code>ادخال</code> (input) يتغير شكله حسب <code>نوع</code>: <code>نص</code> (text)، <code>كلمة_مرور</code>، <code>بريد</code>، <code>رقم</code>، <code>تاريخ</code>، <code>لون</code>، <code>مربع_اختيار</code> (checkbox)، <code>خيار_واحد</code> (radio).</p>
<ul><li><code>تسمية</code> (label) تربط الاسم بالحقل عبر <code>لاجل</code> (for).</li><li><code>مطلوب</code> يمنع الإرسال لو فاضي.</li><li><code>منطقة_نص</code> لنص طويل، <code>اختيار</code> مع <code>خيار</code> لقائمة منسدلة.</li></ul>`,
 html: `<نموذج>
  <تسمية لاجل="اسم">اسمك:</تسمية>
  <ادخال معرف="اسم" نوع="نص" نص_توضيحي="اكتب اسمك" مطلوب>

  </تسمية>
  <سطر_جديد>
  <تسمية><ادخال نوع="مربع_اختيار"> اوافق على الشروط</تسمية>
  <سطر_جديد>
  <زر نوع="ارسال">ارسال</زر>
</نموذج>`,
 ex: 'سوّي نموذج تسجيل: اسم، بريد، كلمة مرور، وزر إرسال.',

{ id: 'h7', t: 'تنظيم الصفحة (وسوم المعنى)', body: `<p>بدل ما تكتب كل شي <code>قسم</code>، فيه وسوم تدل على معنى الجزء: <code>ترويسة</code> (header)، <code>تنقل</code> (nav) للروابط، <code>رئيسي</code> (main) للمحتوى الأساسي، <code>مقطع</code> (section)، <code>مقالة</code> (article)، <code>جانبي</code> (aside)، <code>تذييل</code> (footer).</p>
<p>فايدتها: محركات البحث وقارئات الشاشة تفهم صفحتك أحسن، وكودك يصير أنظف.</p>`,
 html: `<ترويسة><عنوان>موقعي</عنوان>
  <تنقل><رابط وجهة="#">الرئيسية</رابط> | <رابط وجهة="#">عني</رابط></تنقل>
</ترويسة>
<رئيسي>
  <مقطع><عنوان2>من انا</عنوان2><فقرة>مبرمج عربي.</فقرة></مقطع>
  <جانبي><فقرة>اعلان جانبي</فقرة></جانبي>
</رئيسي>
<تذييل><فقرة>جميع الحقوق محفوظة</فقرة></تذييل>`,

 q: { q: 'وين تحط روابط التنقل الرئيسية؟', o: ['تنقل', 'تذييل', 'جانبي'], a: 0 } },

{ id: 'h8', t: 'الوسائط والخصائص العامة', body: `<p><code>فيديو</code> (video) و<code>صوت</code> (audio) يشتغلون مع <code>ازرار_تحكم</code> (controls). <code>اطار</code> (iframe) يعرض صفحة داخل صفحتك.</p>
<p>خصائص تنفع بأي وسم: <code>فئة</code> (class) لمجموعة عناصر، <code>معرف</code> (id) لعنصر واحد فريد، <code>نمط</code> (style) لتنسيق مباشر، <code>مخفي</code> (hidden)، و<code>بيانات-اسم</code> تتحول إلى <code>data-</code> لتخزين بيانات خاصة.</p>`,

]});

COURSE.push({ id: 'css', t: 'مسار CSS', ic: '🎨', d: 'التصميم: ألوان، أحجام، ترتيب، حركة', lessons: [
{ id: 'c1', t: 'ما هو CSS وكيف يشتغل', body: `<p><b>CSS</b> تحدد شكل العناصر. القاعدة: <b>محدِّد</b> يختار العنصر، وبين الأقواس خصائص <code>الخاصية: القيمة;</code>.</p>
<ul><li>محدد الوسم: <code>فقرة { }</code> يختار كل الفقرات.</li><li>محدد الفئة: <code>.بطاقة { }</code> (نقطة قبل الاسم).</li><li>محدد المعرف: <code>#رئيسي { }</code>.</li><li>حالات: <code>زر:تمرير</code> (hover) لما يمرر الماوس.</li></ul>
<p>تكتب CSS داخل <code>ستايل</code> بالراس، أو بملف خارجي. الألوان تقدر تكتبها بالاسم (<code>احمر</code>) أو بالكود <code>#ff0000</code>.</p>`,
 html: `<عنوان>اهلا</عنوان>
<فقرة>نص عادي</فقرة>
<فقرة فئة="مهمة">نص مهم</فقرة>
<زر>اضغط</زر>`,
 css: `عنوان { لون: #7c3aed; }
فقرة { حجم-الخط: 20بكسل; }
.مهمة { لون: احمر; وزن-الخط: عريض; }
زر { خلفية: #ec4899; لون: ابيض; حدود: بدون; حشو: 10بكسل 20بكسل; }
زر:تمرير { خلفية: #be185d; }`,
 ex: 'غيّر لون العنوان وحجم الفقرات وخلفية الزر.',
 q: { q: 'كيف تختار عناصر بفئة اسمها «مهمة»؟', o: ['#مهمة', '.مهمة', 'مهمة:'], a: 1 } },

{ id: 'c2', t: 'الألوان والخطوط والنصوص', body: `<p>الألوان: <code>لون</code> للنص، <code>خلفية</code> أو <code>لون-الخلفية</code>. تقدر تستخدم <code>الوان(255,0,0)</code> (rgb)، أو <code>تدرج-خطي(...)</code> لتدرج.</p>
<p>الخطوط: <code>نوع-الخط</code>، <code>حجم-الخط</code>، <code>وزن-الخط</code>، <code>ارتفاع-السطر</code>. النص: <code>محاذاة-النص</code> (وسط/يمين/يسار)، <code>زخرفة-النص</code>، <code>ظل-النص</code>.</p>
<p>الوحدات: <code>بكسل</code> (px) ثابتة، <code>رم</code> (rem) نسبة لحجم الخط الأساسي، <code>نسبة</code> (%)، <code>عرض_الشاشة</code> (vw).</p>`,
 html: `<عنوان>عنوان ملون</عنوان>
<فقرة>نص بخط كبير ومحاذاة وسط وظل خفيف.</فقرة>`,
 css: `جسم { خلفية: تدرج-خطي(135درجة, #1e1b4b, #7c3aed); لون: ابيض; نوع-الخط: sans-serif; }
عنوان { محاذاة-النص: وسط; ظل-النص: 0 2بكسل 8بكسل #0008; }
فقرة { حجم-الخط: 1.3رم; ارتفاع-السطر: 1.8; محاذاة-النص: وسط; }`,
 ex: 'جرب تدرج ثاني بألوان تحبها وغيّر حجم الخط.',
 q: { q: 'أي خاصية تغير لون النص؟', o: ['لون', 'خلفية', 'حدود'], a: 0 } },

{ id: 'c3', t: 'الصندوق: الهوامش والحشو والحدود', body: `<p>كل عنصر صندوق: <b>المحتوى</b> ثم <code>حشو</code> (padding) داخل الحدود، ثم <code>حدود</code> (border)، ثم <code>هامش</code> (margin) خارج الحدود.</p>
<ul><li><code>حشو: 10بكسل 20بكسل</code> = أعلى/أسفل 10 ويمين/يسار 20.</li><li><code>استدارة-الحدود</code> تدوّر الزوايا، <code>ظل-الصندوق</code> يظلل.</li><li><code>حجم-الصندوق: صندوق_الحدود</code> (border-box) يخلي العرض يشمل الحشو والحدود، ويستحسن تفعله للكل.</li></ul>`,

<قسم فئة="بطاقة">بطاقة ثانية</قسم>`,

.بطاقة { خلفية: ابيض; حشو: 20بكسل; هامش: 12بكسل 0; حدود: 2بكسل متصل #7c3aed; استدارة-الحدود: 16بكسل; ظل-الصندوق: 0 6بكسل 20بكسل #0002; }`,
 ex: 'خلي زوايا البطاقة دائرية أكثر وزيد المسافة بين البطاقتين.',
 q: { q: 'المسافة الخارجية بين العناصر اسمها؟', o: ['حشو', 'هامش', 'حدود'], a: 1 } },

{ id: 'c4', t: 'العرض والموضع', body: `<p><code>ظهور</code> (display) يحدد سلوك العنصر: <code>كتلة</code> (block) ياخذ سطر كامل، <code>سطري</code> (inline) يمشي مع النص، <code>مرن</code> (flex)، <code>شبكة</code> (grid)، <code>بدون</code> يخفيه.</p>
<p><code>موضع</code> (position): <code>نسبي</code> relative، <code>مطلق</code> absolute يتموضع بالنسبة لأقرب أب نسبي، <code>ثابت</code> fixed يبقى بالشاشة، <code>لاصق</code> sticky. بعدها تستخدم <code>اعلى</code> <code>يمين</code> <code>اسفل</code> <code>يسار</code>، و<code>ترتيب-الطبقة</code> (z-index).</p>`,
 html: `<قسم فئة="اب">
  <قسم فئة="شارة">جديد</قسم>
  <فقرة>صندوق نسبي وبداخله شارة بموضع مطلق.</فقرة>
</قسم>`,
 css: `جسم { حشو: 30بكسل; }
.اب { موضع: نسبي; حدود: 2بكسل متقطع #94a3b8; حشو: 30بكسل; ارتفاع: 120بكسل; }
.شارة { موضع: مطلق; اعلى: -12بكسل; يمين: 12بكسل; خلفية: #ec4899; لون: ابيض; حشو: 4بكسل 12بكسل; استدارة-الحدود: 20بكسل; }`,
 ex: 'حرّك الشارة للزاوية اليسرى السفلية.',
 q: { q: 'ثبّت عنصر بالشاشة ما يتحرك مع التمرير:', o: ['موضع: ثابت', 'موضع: نسبي', 'ظهور: بدون'], a: 0 } },

{ id: 'c5', t: 'Flexbox: ترتيب مرن', body: `<p>فعّل <code>ظهور: مرن</code> على الأب وصار أبناؤه يترتبون بمرونة.</p>
<ul><li><code>اتجاه-المرن</code>: صف أو عمود.</li><li><code>محاذاة-المحتوى</code> (justify-content) على المحور الرئيسي: <code>وسط</code>، <code>توزيع_بين</code>، <code>توزيع_حول</code>.</li><li><code>محاذاة-العناصر</code> (align-items) على المحور الثاني.</li><li><code>فجوة</code> مسافة بين الأبناء، <code>التفاف-المرن: التفاف</code> ينزل للسطر التالي.</li><li><code>مرن: 1</code> على ابن يخليه ياخذ المساحة المتبقية.</li></ul>
<p>سر توسيط أي شي بالنص: مرن + محاذاة المحتوى وسط + محاذاة العناصر وسط.</p>`,
 html: `<قسم فئة="شريط"><قسم>1</قسم><قسم>2</قسم><قسم>3</قسم></قسم>
<قسم فئة="وسط">انا بالنص تماما</قسم>`,
 css: `.شريط { ظهور: مرن; محاذاة-المحتوى: توزيع_بين; فجوة: 10بكسل; }
.شريط > قسم { خلفية: #7c3aed; لون: ابيض; حشو: 20بكسل; استدارة-الحدود: 12بكسل; مرن: 1; محاذاة-النص: وسط; }
.وسط { ظهور: مرن; محاذاة-المحتوى: وسط; محاذاة-العناصر: وسط; ارتفاع: 150بكسل; خلفية: #e2e8f0; هامش-علوي: 16بكسل; }`,
 ex: 'خلي الشريط عمودي بدل أفقي.',
 q: { q: 'وش تسوي «فجوة»؟', o: ['تلون الخلفية', 'تضيف مسافة بين الأبناء', 'تخفي العنصر'], a: 1 } },

{ id: 'c6', t: 'Grid: الشبكة', body: `<p>للتخطيط ثنائي الأبعاد: <code>ظهور: شبكة</code> مع <code>اعمدة-الشبكة</code> مثل <code>مكرر(3, 1جزء)</code> = ثلاث أعمدة متساوية (repeat(3, 1fr)). <code>فجوة</code> للمسافات.</p>
<p>تجاوب بدون media: <code>اعمدة-الشبكة: مكرر(auto-fit, ادنى-اقصى(150بكسل, 1جزء))</code> تتوزع الأعمدة حسب عرض الشاشة.</p>
<p>لدمج خلايا: <code>عمود-الشبكة: 1 / 3</code> يمدد العنصر على عمودين.</p>`,
 html: `<قسم فئة="شبكة">
  <قسم>1</قسم><قسم>2</قسم><قسم>3</قسم><قسم>4</قسم><قسم>5</قسم><قسم>6</قسم>
</قسم>`,
 css: `.شبكة { ظهور: شبكة; اعمدة-الشبكة: مكرر(auto-fit, ادنى-اقصى(90بكسل, 1جزء)); فجوة: 10بكسل; }
.شبكة > قسم { خلفية: #0ea5e9; لون: ابيض; حشو: 24بكسل; محاذاة-النص: وسط; استدارة-الحدود: 10بكسل; }`,
 ex: 'خلي أول عنصر ياخذ عمودين بـ عمود-الشبكة.',
 q: { q: 'أي قيمة تعني ثلاث أعمدة متساوية؟', o: ['مكرر(3, 1جزء)', 'مرن(3)', 'ظهور: 3'], a: 0 } },

{ id: 'c7', t: 'الانتقالات والتحويلات والحركة', body: `<p><code>انتقال</code> (transition) يخلي التغيير ناعم: <code>انتقال: كل 0.3ثانية</code>. <code>تحويل</code> (transform): <code>تكبير(1.1)</code> scale، <code>تدوير(10درجة)</code> rotate، <code>ازاحة-س(20بكسل)</code> translateX.</p>
<p>الحركة المخصصة: عرّف <code>@حركة اسم { من {...} الى {...} }</code> (keyframes) ثم استخدمها <code>حركة: اسم 2ثانية لانهائي</code> (animation).</p>`,
 html: `<قسم فئة="كرة">اضغط مطولا</قسم>
<قسم فئة="دوار"></قسم>`,
 css: `جسم { ظهور: مرن; فجوة: 30بكسل; محاذاة-المحتوى: وسط; محاذاة-العناصر: وسط; ارتفاع: 100ارتفاع_الشاشة; هامش: 0; }
.كرة { خلفية: #ec4899; لون: ابيض; حشو: 30بكسل; استدارة-الحدود: 50%; انتقال: كل 0.3ثانية; مؤشر: يد; }
.كرة:تمرير { تحويل: تكبير(1.25) تدوير(10درجة); }
@حركة دوران { من { تحويل: تدوير(0درجة); } الى { تحويل: تدوير(360درجة); } }
.دوار { عرض: 50بكسل; ارتفاع: 50بكسل; خلفية: #7c3aed; استدارة-الحدود: 12بكسل; حركة: دوران 2ثانية خطي لانهائي; }`,
 ex: 'غيّر سرعة الدوران وسوّي الكرة تنتفخ وتصغر.',
 q: { q: 'أي خاصية تخلي تغيّر الشكل ناعم؟', o: ['انتقال', 'ظهور', 'موضع'], a: 0 } },

{ id: 'c8', t: 'التجاوب والمتغيرات', body: `<p>الصفحة لازم تظهر زين بالتلفون والكمبيوتر. استخدم الوحدات النسبية و<code>@وسائط</code> (media): <code>@وسائط (اقصى-عرض: 600بكسل) { ... }</code> يطبق القواعد على الشاشات الأصغر من 600.</p>
<p>المتغيرات: عرّفها بالجذر <code>:جذر { --لوني: #7c3aed; }</code> واستعملها <code>لون: متغير(--لوني)</code>. تغيّر اللون بمكان واحد فيتغير بكل الصفحة. والوضع الداكن: <code>@وسائط (تفضيل-الالوان: داكن)</code> ... أو بدّل المتغيرات بفئة.</p>`,
 html: `<قسم فئة="لوحة"><قسم فئة="خلية">أ</قسم><قسم فئة="خلية">ب</قسم><قسم فئة="خلية">ج</قسم></قسم>`,
 css: `:جذر { --لوني: #7c3aed; --فراغ: 12بكسل; }
.لوحة { ظهور: مرن; فجوة: متغير(--فراغ); حشو: متغير(--فراغ); }
.خلية { مرن: 1; خلفية: متغير(--لوني); لون: ابيض; حشو: 30بكسل; محاذاة-النص: وسط; استدارة-الحدود: 12بكسل; }
@وسائط (اقصى-عرض: 600بكسل) { .لوحة { اتجاه-المرن: عمود; } }`,
 ex: 'غيّر قيمة --لوني وشوف كل الصفحة تتغير، وصغّر المعاينة وشوف الأعمدة تصير عمودية.',
 q: { q: 'كيف تعرّف متغير CSS؟', o: ['--اسم: قيمة', '$اسم = قيمة', 'متغير اسم'], a: 0 } }
]});

COURSE.push({ id: 'js', t: 'مسار JavaScript', ic: '⚡', d: 'البرمجة الحقيقية: منطق، بيانات، وتفاعل', lessons: [
{ id: 'j1', t: 'المتغيرات والأنواع', body: `<p>المتغير صندوق باسم تخزن فيه قيمة. <code>ثابت</code> (const) ما تتغير قيمته، <code>متغير</code> (let) تتغير. تجنب <code>متغير_قديم</code> (var).</p>
<p>الأنواع: نص <code>"مرحبا"</code>، رقم <code>25</code>، منطقي <code>صحيح</code>/<code>خطا</code> (true/false)، <code>فارغ</code> (null)، <code>غير_محدد</code> (undefined). <code>نوع س</code> (typeof) يكشف النوع.</p>
<p>الأسماء تقدر تكتبها عربي! نيرو يبقيها كما هي لأنها أسماء من عندك. استخدم <code>اطبع()</code> (console.log) لتشوف النتائج بوحدة التحكم.</p>`,
 js: `ثابت اسم = "علي";
متغير عمر = 25;
عمر = عمر + 1;
ثابت طالب = صحيح;
اطبع("الاسم:", اسم);
اطبع("العمر:", عمر);
اطبع("نوع العمر:", نوع عمر);
اطبع(\`\${اسم} عمره \${عمر} سنة\`);`,
 ex: 'عرّف متغيرات لاسمك وبلدك وعمرك، واطبع جملة تجمعهم.',
 q: { q: 'أي كلمة تعرّف قيمة ما تتغير؟', o: ['ثابت', 'متغير', 'دالة'], a: 0 } },

{ id: 'j2', t: 'العمليات والمقارنات', body: `<p>الحساب: <code>+ - * / %</code> و<code>**</code> للأس. الزيادة <code>س++</code>.</p>
<p>المقارنة: <code>===</code> مساواة صارمة (استخدمها دائماً)، <code>!==</code>، <code>&gt;</code>، <code>&lt;</code>. المنطق: <code>وايضا</code> (&amp;&amp;) <code>او</code> (||) <code>ليس</code> (!).</p>
<p>الدمج: النص + نص يلصقهم، لكن "5" + 1 يعطي "51"! حوّل بـ <code>عدد("5")</code> (Number).</p>`,
 js: `اطبع(7 + 3, 7 % 3, 2 ** 5);
اطبع(5 === 5, 5 === "5", 5 > 3);
اطبع(1 > 0 وايضا 2 > 1, 1 > 5 او 2 > 1, ليس صحيح);
اطبع("5" + 1, عدد("5") + 1);`,
 ex: 'جرب تحسب مساحة مستطيل 8 × 5 ومحيطه واطبعهم.',
 q: { q: 'نتيجة "5" + 1 هي:', o: ['6', '"51"', 'خطأ'], a: 1 } },

{ id: 'j3', t: 'الشروط', body: `<p>الشرط يخلي البرنامج يقرر: <code>اذا (الشرط) { ... } والا اذا (...) { ... } والا { ... }</code>.</p>
<p>القيم «الكاذبة» بالشرط: <code>خطا</code>، 0، "" الفارغ، <code>فارغ</code>، <code>غير_محدد</code>. غيرها «صادقة».</p>
<p>اختصار: <code>الشرط ? أ : ب</code> (ternary). و<code>تبديل</code> (switch) لما تقارن قيمة واحدة بعدة حالات.</p>`,
 js: `ثابت درجة = 82;
اذا (درجة >= 90) { اطبع("ممتاز"); }
والا اذا (درجة >= 75) { اطبع("جيد جدا"); }
والا اذا (درجة >= 50) { اطبع("مقبول"); }
والا { اطبع("راسب"); }
ثابت نتيجة = درجة >= 50 ? "ناجح" : "راسب";
اطبع(نتيجة);
ثابت يوم = 5;
تبديل (يوم) {
  حالة 5: اطبع("الجمعة"); توقف;
  حالة 6: اطبع("السبت"); توقف;
  افتراضي: اطبع("يوم عادي");
}`,
 ex: 'اكتب شرط يطبع «صباح الخير» أو «مساء الخير» حسب ساعة عندك.',
 q: { q: 'أي كلمة تنفذ لما كل الشروط تفشل؟', o: ['والا', 'حالة', 'توقف'], a: 0 } },

{ id: 'j4', t: 'الحلقات', body: `<p>الحلقة تكرر عمل: <code>لكل (متغير ع = 0; ع &lt; 5; ع++) { }</code> (for). <code>بينما (شرط) { }</code> (while) تكرر طول ما الشرط صحيح.</p>
<p><code>لكل (ثابت س من مصفوفة)</code> (for...of) تمر على عناصر المصفوفة. <code>توقف</code> (break) يوقف الحلقة، <code>استمر</code> (continue) يقفز للدورة التالية. احذر الحلقة اللانهائية!</p>`,
 js: `لكل (متغير ع = 1; ع <= 5; ع++) { اطبع("الدورة", ع); }
متغير عداد = 3;
بينما (عداد > 0) { اطبع("عد تنازلي:", عداد); عداد--; }
لكل (ثابت فاكهة من ["تفاح", "موز", "برتقال"]) {
  اذا (فاكهة === "موز") { استمر; }
  اطبع(فاكهة);
}`,
 ex: 'اطبع جدول ضرب 7 من 1 إلى 10.',
 q: { q: 'وش يسوي «توقف» داخل حلقة؟', o: ['يوقف الحلقة بالكامل', 'يقفز للدورة التالية', 'يعيد الحلقة'], a: 0 } },

{ id: 'j5', t: 'الدوال', body: `<p>الدالة كود تكتبه مرة وتستدعيه مرات. <code>دالة اسم(مدخلات) { ... ارجع قيمة; }</code>. المدخلات تسمى <b>معاملات</b> (parameters)، و<code>ارجع</code> (return) تخرج النتيجة.</p>
<p>الدالة السهمية: <code>(أ, ب) =&gt; أ + ب</code> مختصرة. تقدر تعطي معامل قيمة افتراضية <code>دالة سلم(اسم = "ضيف")</code>.</p>`,
 js: `دالة جمع(أ, ب) { ارجع أ + ب; }
اطبع(جمع(4, 6));
دالة سلم(اسم = "ضيف") { ارجع "اهلا " + اسم; }
اطبع(سلم(), سلم("زينب"));
ثابت مربع = (س) => س * س;
اطبع(مربع(9));`,
 ex: 'اكتب دالة تحسب مساحة دائرة من نصف القطر (استخدم رياضيات.باي).',
 q: { q: 'أي كلمة تُخرج نتيجة من الدالة؟', o: ['ارجع', 'توقف', 'اطبع'], a: 0 } },

{ id: 'j6', t: 'المصفوفات', body: `<p>المصفوفة قائمة مرتبة: <code>[1, 2, 3]</code>. الوصول بالفهرس يبدأ من 0: <code>م[0]</code>. <code>م.طول</code> عددها.</p>
<ul><li><code>ادفع</code> push يضيف بالنهاية، <code>اسحب</code> pop يشيل الأخير.</li><li><code>خريطة</code> map يحوّل كل عنصر، <code>رشح</code> filter يختار، <code>اختزل</code> reduce يجمع لقيمة واحدة.</li><li><code>جد</code> find، <code>يشمل</code> includes، <code>رتب</code> sort، <code>اربط</code> join.</li></ul>`,
 js: `ثابت ارقام = [5, 2, 8, 1];
ارقام.ادفع(10);
اطبع(ارقام.طول, ارقام[0]);
ثابت مضاعف = ارقام.خريطة(س => س * 2);
ثابت كبار = ارقام.رشح(س => س > 4);
ثابت مجموع = ارقام.اختزل((ج, س) => ج + س, 0);
اطبع(مضاعف, كبار, مجموع);
اطبع(ارقام.رتب((أ, ب) => أ - ب).اربط(" < "));`,
 ex: 'من مصفوفة درجات، اطبع الدرجات الناجحة (>=50) ومعدلها.',
 q: { q: 'أي دالة تختار العناصر اللي تحقق شرط؟', o: ['رشح', 'خريطة', 'ادفع'], a: 0 } },

{ id: 'j7', t: 'الكائنات', body: `<p>الكائن يجمع بيانات مرتبطة بأسماء (مفتاح: قيمة): <code>{ اسم: "علي", عمر: 20 }</code>. الوصول: <code>طالب.اسم</code> أو <code>طالب["اسم"]</code>.</p>
<p>الكائن يقدر يحمل دوال (تسمى <b>طرق</b>). <code>كائن.مفاتيح(ك)</code> يعطي المفاتيح. التفكيك: <code>ثابت { اسم, عمر } = طالب;</code> وفك المصفوفة والنسخ بـ <code>...</code>.</p>`,
 js: `ثابت طالب = { اسم: "علي", عمر: 20, مواد: ["رياضيات", "علوم"],
  عرف() { ارجع "انا " + هذا.اسم; } };
اطبع(طالب.اسم, طالب["عمر"], طالب.مواد[1]);
اطبع(طالب.عرف());
طالب.بلد = "العراق";
اطبع(كائن.مفاتيح(طالب));
ثابت { اسم, عمر } = طالب;
اطبع(اسم, عمر);
ثابت نسخة = { ...طالب, عمر: 21 };
اطبع(نسخة.عمر, جيسون.حول_الى_نص(نسخة));`,
 ex: 'سوّي كائن «سيارة» بلون وموديل ودالة تطبع وصفها.',
 q: { q: 'كيف توصل لخاصية اسم بكائن طالب؟', o: ['طالب.اسم', 'طالب(اسم)', 'طالب->اسم'], a: 0 } }
]});

COURSE[2].lessons.push(
{ id: 'j8', t: 'التحكم بالصفحة (DOM)', body: `<p>الجافاسكربت تقدر تغيّر الصفحة. <code>وثيقة</code> (document) تمثل الصفحة. تختار عنصر بـ <code>وثيقة.استعلام(".فئة")</code> (querySelector) أو <code>عنصر_بالمعرف("اسم")</code>، وكل العناصر بـ <code>استعلام_الكل</code>.</p>
<ul><li><code>نص_داخلي</code> (innerText) يغير النص. <code>اتش_تي_ام_ال_داخلي</code> (innerHTML) يغير الوسوم (احذر من إدخال المستخدم).</li><li><code>نمط.لون_الخلفية</code> (style.backgroundColor) يغير التنسيق.</li><li><code>قائمة_الفئات.بدل("فعال")</code> (classList.toggle) أنظف طريقة لتبديل الشكل.</li><li><code>انشئ_عنصر("زر")</code> ثم <code>اضف_ابن(...)</code> لإنشاء عناصر جديدة.</li></ul>
<p>داخل نيرو، النصوص اللي تدخلها لـ <code>استعلام</code> مثل <code>"قسم.بطاقة"</code> تتحول تلقائياً <code>"div.بطاقة"</code>.</p>`,
 html: `<عنوان معرف="ع">قبل</عنوان>
<قسم معرف="قائمة"></قسم>`,
 js: `ثابت ع = وثيقة.عنصر_بالمعرف("ع");
ع.نص_داخلي = "بعد التغيير!";

{ id: 'j9', t: 'الأحداث', body: `<p>الحدث شي يصير بالصفحة: ضغطة، كتابة، تمرير. تسمع له بـ <code>عنصر.اضف_مستمع("نقر", دالة)</code> (addEventListener "click"). الدالة تستقبل كائن الحدث: <code>ح.هدف</code> (target)، <code>ح.مفتاح</code> (key).</p>

<زر معرف="زر">اضغط</زر>
<فقرة معرف="ناتج">...</فقرة>
<فقرة معرف="عداد">0</فقرة>`,
 js: `ثابت حقل = وثيقة.عنصر_بالمعرف("حقل");
ثابت ناتج = وثيقة.عنصر_بالمعرف("ناتج");

{ id: 'j10', t: 'الوعود وجلب البيانات', body: `<p>العمليات البطيئة (إنترنت، مؤقت) ما توقف الصفحة: تعيد <b>وعداً</b> (Promise) ينتهي لاحقاً. تتعامل معه بـ <code>.ثم(...)</code> (then) أو الأسهل <code>انتظر</code> (await) داخل دالة <code>غير_متزامن</code> (async).</p>
<p><code>جلب(رابط)</code> (fetch) يطلب بيانات من الإنترنت، و<code>.json()</code> يحولها لكائن. <code>حاول { } امسك (خ) { }</code> (try/catch) يمسك الأخطاء. المؤقتات: <code>ضبط_مهلة(دالة, ms)</code> مرة واحدة، <code>ضبط_فاصل</code> تكرار.</p>`,
 js: `دالة انتظار(ms) { ارجع جديد وعد((تم) => ضبط_مهلة(تم, ms)); }
غير_متزامن دالة تجربة() {
  اطبع("بدأنا");
  انتظر انتظار(800);
  اطبع("مرت ثانية تقريبا");
  حاول {
    ثابت رد = انتظر جلب("https://jsonplaceholder.typicode.com/todos/1");
    ثابت بيانات = انتظر رد.json();
    اطبع("العنوان:", بيانات.title);
  } امسك (خطأ) {
    اطبع("فشل الاتصال:", خطأ.رسالة);
  }
}
تجربة();`,
 ex: 'غيّر الرابط لـ /users/1 واطبع اسم المستخدم.',
 q: { q: 'أي كلمة تنتظر نتيجة وعد داخل دالة غير_متزامن؟', o: ['انتظر', 'ارجع', 'توقف'], a: 0 } },

{ id: 'j11', t: 'التخزين وJSON', body: `<p><code>تخزين_محلي</code> (localStorage) يحفظ نصوص بالمتصفح حتى بعد إغلاق الصفحة: <code>احفظ_مخزن("مفتاح", "قيمة")</code> (setItem) و<code>احصل_مخزن("مفتاح")</code> (getItem).</p>
<p>لتخزين كائنات حوّلها لنص بـ <code>جيسون.حول_الى_نص(كائن)</code> (JSON.stringify) وارجعها بـ <code>جيسون.حلل(نص)</code> (JSON.parse). ملاحظة: داخل المعاينة التخزين مؤقت، وفي تطبيقك النهائي يكون دائم.</p>`,
 js: `ثابت اعدادات = { سمة: "داكن", حجم: 18 };
تخزين_محلي.احفظ_مخزن("اعدادات", جيسون.حول_الى_نص(اعدادات));
ثابت نص = تخزين_محلي.احصل_مخزن("اعدادات");
ثابت راجع = جيسون.حلل(نص);
اطبع(نص);
اطبع(راجع.سمة, راجع.حجم);
اطبع(تخزين_محلي.احصل_مخزن("غير_موجود"));`,
 ex: 'احفظ اسم المستخدم وارجعه، وإذا ما وجدته اطبع «ضيف».',
 q: { q: 'كيف تخزن كائن بالـ localStorage؟', o: ['تحوله لنص بـ JSON', 'تخزنه مباشرة', 'ما يمكن'], a: 0 } },

{ id: 'j12', t: 'الأصناف (البرمجة الكائنية)', body: `<p>الصنف <code>صنف</code> (class) قالب لصنع كائنات متشابهة. <code>منشئ</code> (constructor) يجهز الكائن، و<code>هذا</code> (this) يشير للكائن نفسه. تسوي كائن بـ <code>جديد اسم_الصنف(...)</code> (new).</p>
<p>الوراثة: <code>صنف قط يمتد حيوان</code> (extends) والكلمة <code>الاب(...)</code> (super) تستدعي منشئ الأب. داخل الصنف تكتب الطرق بدون كلمة دالة.</p>`,
 js: `صنف حيوان {
  منشئ(اسم) { هذا.اسم = اسم; }
  تكلم() { اطبع(هذا.اسم + " يصدر صوتا"); }
}
صنف قط يمتد حيوان {
  تكلم() { اطبع(هذا.اسم + " يموء: مياو"); }
}
ثابت ح = جديد حيوان("شي");
ثابت ق = جديد قط("بسبوس");
ح.تكلم();
ق.تكلم();
اطبع(ق نسخة_من حيوان);`,
 ex: 'سوّي صنف «سيارة» بطريقة تسرّع، وصنف يرث منه «سيارة_كهربائية».',
 q: { q: 'وش يمثل «هذا» داخل الصنف؟', o: ['الكائن الحالي', 'الصنف الأب', 'الصفحة'], a: 0 } },

{ id: 'j13', t: 'الأخطاء وتنظيف الكود', body: `<p>الأخطاء حاجة طبيعية. اقرأ رسالة الخطأ بوحدة التحكم (معاينة ← زر وحدة التحكم): فيها نوع الخطأ ورقم السطر. أشهرها: استخدام متغير ما عرفته، قوس ناقص، أو الوصول لخاصية على <code>غير_محدد</code>.</p>
<p>تحكّم بالأخطاء: <code>حاول { } امسك (خ) { } اخيرا { }</code> وارمِ أخطاءك بنفسك بـ <code>ارمي جديد خطا_عام("رسالة")</code>. عادات جيدة: أسماء واضحة، دوال صغيرة، تعليقات <code>// هكذا</code>، واختبار كل جزء بـ <code>اطبع</code>.</p>`,
 js: `دالة قسمة(أ, ب) {
  اذا (ب === 0) { ارمي جديد خطا_عام("ما يمكن القسمة على صفر"); }
  ارجع أ / ب;
}
حاول {
  اطبع(قسمة(10, 2));
  اطبع(قسمة(1, 0));
} امسك (خطأ) {
  اطبع("مسكت الخطأ:", خطأ.رسالة);
} اخيرا {
  اطبع("انتهينا");
}`,
 ex: 'اكتب دالة تتحقق إن العمر رقم موجب وترمي خطأ إن لا.',
 q: { q: 'أي كتلة تنفذ دائماً حتى لو صار خطأ؟', o: ['اخيرا', 'امسك', 'حاول'], a: 0 } }
);

{ id: 'p1', t: 'مشروع: بطاقة التعريف', body: `<p>أول مشروع: بطاقة تعريف شخصية تجمع HTML وCSS. فكّر بالتركيب: قسم البطاقة ← صورة + اسم + نبذة + أزرار.</p>

{ id: 'p2', t: 'مشروع: قائمة المهام', body: `<p>تطبيق مهام كامل: إضافة، شطب، حذف، وعدّاد. يجمع الدوال والمصفوفات والأحداث وتحديث الصفحة.</p>
<p>الفكرة: مصفوفة <code>مهام</code> هي «مصدر الحقيقة». كل تغيير يعدّل المصفوفة ثم يستدعي <code>ارسم()</code> لإعادة بناء القائمة. هذا النمط أساس أغلب التطبيقات.</p>`,
 html: `<قسم فئة="تطبيق">
  <عنوان>مهامي</عنوان>
  <قسم فئة="صف"><ادخال معرف="حقل" نص_توضيحي="مهمة جديدة"><زر معرف="اضف">اضافة</زر></قسم>
  <قائمة معرف="قائمة"></قائمة>
  <فقرة معرف="عداد"></فقرة>
</قسم>`,
 css: `جسم { نوع-الخط: sans-serif; خلفية: #f1f5f9; ظهور: مرن; محاذاة-المحتوى: وسط; حشو: 20بكسل; }
.تطبيق { خلفية: ابيض; حشو: 20بكسل; استدارة-الحدود: 16بكسل; عرض: 100%; اقصى-عرض: 380بكسل; ظل-الصندوق: 0 10بكسل 30بكسل #0002; }
.صف { ظهور: مرن; فجوة: 8بكسل; }

زر { خلفية: #7c3aed; لون: ابيض; حدود: بدون; استدارة-الحدود: 8بكسل; حشو: 8بكسل 14بكسل; }

.تم نص { زخرفة-النص: يتوسطه_خط; لون: #94a3b8; }`,
 js: `متغير مهام = [{ نص: "تعلم HTML", تم: صحيح }, { نص: "تعلم CSS", تم: خطا }];
ثابت قائمة = وثيقة.عنصر_بالمعرف("قائمة");
ثابت حقل = وثيقة.عنصر_بالمعرف("حقل");
دالة ارسم() {
  قائمة.اتش_تي_ام_ال_داخلي = "";
  مهام.لكل_عنصر((م, ف) => {
    ثابت ع = وثيقة.انشئ_عنصر("عنصر");
    ع.قائمة_الفئات.بدل("تم", م.تم);
    ثابت ن = وثيقة.انشئ_عنصر("نص");
    ن.محتوى_نصي = م.نص;
    ن.اضف_مستمع("نقر", () => { م.تم = ليس م.تم; ارسم(); });
    ثابت ز = وثيقة.انشئ_عنصر("زر");
    ز.محتوى_نصي = "x";
    ز.اضف_مستمع("نقر", () => { مهام.وصل(ف, 1); ارسم(); });

دالة اضف() {
  ثابت نص = حقل.قيمة.قص();
  اذا (نص) { مهام.ادفع({ نص, تم: خطا }); حقل.قيمة = ""; ارسم(); }
}
وثيقة.عنصر_بالمعرف("اضف").اضف_مستمع("نقر", اضف);
حقل.اضف_مستمع("ضغط_مفتاح", (ح) => { اذا (ح.مفتاح === "Enter") { اضف(); } });
ارسم();`,

{ id: 'p3', t: 'مشروع: حاسبة', body: `<p>حاسبة بسيطة تدرّبك على الشبكة (Grid) وعلى قراءة ضغطات الأزرار. نبني الشاشة كنص، وكل زر يضيف رمزه، وزر = يحسب.</p>

const CAP = '<script>(function(){var p=function(t,a){try{parent.postMessage({nero:1,t:t,m:Array.prototype.map.call(a,function(x){try{return typeof x==="object"?JSON.stringify(x):String(x)}catch(e){return String(x)}}).join(" ")},"*")}catch(e){}};["log","info","warn","error"].forEach(function(k){var o=console[k];console[k]=function(){p(k,arguments);try{o.apply(console,arguments)}catch(e){}}});window.addEventListener("error",function(e){p("error",[e.message+" (سطر "+e.lineno+")"])});window.addEventListener("unhandledrejection",function(e){p("error",[String(e.reason)])});["localStorage","sessionStorage"].forEach(function(n){try{window[n].getItem("x")}catch(e){var m={};try{Object.defineProperty(window,n,{configurable:true,value:{getItem:function(k){return k in m?m[k]:null},setItem:function(k,v){m[k]=String(v)},removeItem:function(k){delete m[k]},clear:function(){m={}},key:function(i){return Object.keys(m)[i]||null},get length(){return Object.keys(m).length}}})}catch(e2){}}})})();<\/script>';
let pvCode = '';
function runPreview(showConsole) {
  const f = cur(), k = kind(f);
  if (k !== 'html') { toast('التشغيل متاح لملفات HTML'); return; }
  previewDoc(ta.value, showConsole);
}
function previewDoc(arabicSrc, showConsole) {
  let code = N.convert(arabicSrc, 'html');
  if (/<head[^>]*>/i.test(code)) code = code.replace(/<head[^>]*>/i, m => m + CAP);
  else if (/<!doctype[^>]*>/i.test(code)) code = code.replace(/<!doctype[^>]*>/i, m => m + CAP);
  else code = CAP + code;
  pvCode = code; $('#pvl').innerHTML = '';
  $('#pvf').srcdoc = code;
  $('#pv').classList.add('open');
  $('#pvc').classList.toggle('open', !!showConsole === true);
}

  const l = $('#pvl'), row = document.createElement('div'); row.className = d.t; row.textContent = d.m; l.appendChild(row); l.scrollTop = l.scrollHeight;

    h.innerHTML = '<span class="ic">' + tr.ic + '</span><span class="tt"><b>' + escH(tr.t) + '</b><small>' + escH(tr.d) + ' · ' + d + '/' + tr.lessons.length + '</small><div class="bar"><i style="width:' + Math.round(d * 100 / tr.lessons.length) + '%"></i></div></span><span>' + (openTrk.has(tr.id) ? '▴' : '▾') + '</span>';
    h.onclick = () => { openTrk.has(tr.id) ? openTrk.delete(tr.id) : openTrk.add(tr.id); renderCourse(); };
    box.appendChild(h);
    if (openTrk.has(tr.id)) tr.lessons.forEach((l, i) => {
      const b = document.createElement('button'); b.className = 'les' + (isDone(l.id) ? ' done' : '');
      b.innerHTML = '<span class="n">' + (isDone(l.id) ? '✓' : i + 1) + '</span><span style="flex:1">' + escH(l.t) + '</span>';
      b.onclick = () => { curLesson = l.id; lpart = l.html ? 'html' : (l.css ? 'css' : 'js'); lenv = false; renderCourse(); $('#course').scrollTop = 0; };
      box.appendChild(b);
    });
    c.appendChild(box);
  });
}
function renderLesson(c) {
  const all = allLessons(), idx = all.findIndex(l => l.id === curLesson), L = all[idx];
  if (!L) { curLesson = null; return renderCourse(); }
  const v = document.createElement('div'); v.className = 'lv';
  const back = document.createElement('button'); back.className = 'back'; back.textContent = '→ كل الدروس'; back.onclick = () => { curLesson = null; renderCourse(); };
  v.appendChild(back);
  v.insertAdjacentHTML('beforeend', '<h2>' + escH(L.t) + '</h2><div class="tx">' + L.body + '</div>');
  const parts = [['html', 'HTML'], ['css', 'CSS'], ['js', 'JS']].filter(p => L[p[0]]);
  if (parts.length && !parts.some(p => p[0] === lpart)) lpart = parts[0][0];
  const pt = document.createElement('div'); pt.className = 'pt';
  parts.forEach(p => { const b = document.createElement('button'); b.textContent = p[1]; if (p[0] === lpart) b.className = 'on'; b.onclick = () => { lpart = p[0]; renderCourse(); }; pt.appendChild(b); });
  const en = document.createElement('button'); en.textContent = lenv ? 'EN ✓' : 'EN'; en.className = lenv ? 'on' : ''; en.style.marginRight = 'auto'; en.onclick = () => { lenv = !lenv; renderCourse(); };
  pt.appendChild(en); v.appendChild(pt);
  const kindP = lpart === 'js' ? 'js' : lpart === 'css' ? 'css' : 'html';
  const src = L.full && lpart === 'html' ? L.html : L[lpart];
  const shown = lenv ? N.convert(src, kindP) : src;
  const cb = document.createElement('div'); cb.className = 'cb';
  cb.innerHTML = '<div class="cbh"><span><button data-a="copy">نسخ</button></span><span>' + (lenv ? 'English' : 'عربي') + '</span></div><pre>' + codeHTML(shown, kindP) + '</pre>';
  cb.querySelector('[data-a=copy]').onclick = () => copyText(shown);
  v.appendChild(cb);
  const ac = document.createElement('div'); ac.className = 'lacts';
  const mkb = (t, fn, p) => { const b = document.createElement('button'); b.textContent = t; if (p) b.className = 'p'; b.onclick = fn; ac.appendChild(b); };
  mkb('▶ جرّبها', () => { previewDoc(lessonDoc(L), L.js ? true : false); }, true);
  mkb('✏️ افتحها بالمحرر', () => {
    const f = newFile(uniqueName('درس-' + L.id + '.html'), lessonDoc(L)); S.files.push(f); closeAI(); loadFile(f.id); toast('فتحت الدرس بالمحرر، عدّل عليه وجرّب');
  });
  mkb('🤖 اشرح لي الدرس', () => send('أنا بدرس درس «' + L.t + '» من كورس نيرو. اشرح لي فكرته بأسلوب مبسط ومثال جديد مختلف عن مثال الدرس، ثم اعطني تمرين صغير.\nكود الدرس:\n```\n' + src.slice(0, 2500) + '\n```', 'اشرح لي درس «' + L.t + '»'));
  v.appendChild(ac);
  v.insertAdjacentHTML('beforeend', '<div class="exb"><b>✍️ التمرين:</b> ' + escH(L.ex || '') + '</div>');
  if (L.q) {
    const qz = document.createElement('div'); qz.className = 'qz'; qz.innerHTML = '<b>🧠 اختبار سريع:</b><br>' + escH(L.q.q);
    L.q.o.forEach((o, i) => {
      const b = document.createElement('button'); b.textContent = o;
      b.onclick = () => {
        qz.querySelectorAll('button').forEach(x => x.className = '');
        if (i === L.q.a) { b.className = 'ok'; if (!isDone(L.id)) { S.prog[L.id] = 1; persist(); toast('إجابة صحيحة! تم تسجيل الدرس ✓'); } }
        else b.className = 'no';
      };
      qz.appendChild(b);
    });
    v.appendChild(qz);
  }
  const nav = document.createElement('div'); nav.className = 'lnav';
  const doneB = document.createElement('button'); doneB.textContent = isDone(L.id) ? '✓ مكتمل (إلغاء)' : 'أكملت الدرس ✓';
  doneB.onclick = () => { if (isDone(L.id)) delete S.prog[L.id]; else S.prog[L.id] = 1; persist(); renderCourse(); };
  nav.appendChild(doneB);
  if (idx < all.length - 1) { const nx = document.createElement('button'); nx.className = 'p'; nx.textContent = 'التالي ←'; nx.onclick = () => { if (!isDone(L.id)) { S.prog[L.id] = 1; persist(); } curLesson = all[idx + 1].id; lpart = all[idx + 1].html ? 'html' : (all[idx + 1].css ? 'css' : 'js'); lenv = false; renderCourse(); $('#course').scrollTop = 0; }; nav.appendChild(nx); }
  v.appendChild(nav); c.appendChild(v);
}
$('#aiSend').onclick = () => { const i = $('#aiIn'); const v = i.value; i.value = ''; send(v); };
$('#aiIn').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $('#aiSend').click(); } });

/* ===== ربط الأزرار ===== */
function wire() {
  $('#bMenu').innerHTML = svg('menu'); $('#bMenu').onclick = () => openDrawer();
  $('#bConv').innerHTML = svg('trans') + 'EN'; $('#bConv').onclick = () => convertDlg();
  $('#bEdit').innerHTML = svg('edit'); $('#bEdit').onclick = mainMenu;
  $('#bRun').innerHTML = svg('play'); $('#bRun').onclick = () => runPreview(false);
  $('#bMore').innerHTML = svg('more'); $('#bMore').onclick = fileMenu;
  $('#fPrev').innerHTML = svg('up'); $('#fNext').innerHTML = svg('down'); $('#fX').innerHTML = svg('close');
  $('#fPrev').onclick = () => findStep(-1); $('#fNext').onclick = () => findStep(1); $('#fX').onclick = () => toggleFind(false);
  $('#rOne').onclick = replaceOne; $('#rAll').onclick = replaceAll;
  $('#fab').innerHTML = svg('down');
  $('#pvX').innerHTML = svg('close'); $('#pvX').onclick = closePreview;
  $('#pvR').innerHTML = svg('refresh'); $('#pvR').onclick = () => { $('#pvl').innerHTML = ''; $('#pvf').srcdoc = pvCode; };
  $('#pvC').innerHTML = svg('term'); $('#pvC').onclick = () => $('#pvc').classList.toggle('open');
  $('#pvClr').onclick = () => { $('#pvl').innerHTML = ''; };
  $('#aiX').innerHTML = svg('close'); $('#aiX').onclick = closeAI;
  $('#aiClr').innerHTML = svg('trash'); $('#aiClr').onclick = () => { chat = []; aim.innerHTML = ''; setTab('chat'); };
  document.querySelectorAll('#aitabs button').forEach(b => { b.onclick = () => setTab(b.dataset.t); });
  $('#aiSend').innerHTML = svg('send');
}
function fitViewport() {
  const vv = window.visualViewport, app = $('#app');
  const h = vv ? vv.height : window.innerHeight;
  app.style.height = h + 'px'; app.style.top = (vv ? vv.offsetTop : 0) + 'px';
  setTimeout(() => { reveal(ta.selectionStart); }, 50);
}
if (window.visualViewport) { window.visualViewport.addEventListener('resize', fitViewport); window.visualViewport.addEventListener('scroll', fitViewport); }
window.addEventListener('resize', fitViewport);
window.addEventListener('beforeunload', () => { const f = cur(); if (f) { f.content = ta.value; f.sel = [ta.selectionStart, ta.selectionEnd]; f.top = ta.scrollTop; } persist(true); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { const f = cur(); if (f) { f.content = ta.value; } persist(true); } });
window.addEventListener('error', e => { try { console.error(e.message); } catch (x) {} });

load(); applyFont(); wire(); buildQT(); renderQT(); fitViewport(); loadFile(S.active);
window.NeroApp = { S, convertDlg, runPreview, loadFile, cur, commit, send, openAI, openDrawer, settingsDlg, mainMenu, fileMenu, undo, redo, saveFile, moveLines, copyLines, indent, moveCaret, insertSnippet, toggleFind, findStep, formatCode };
})();
