<head>

<style>
:root{--bg:#272b36;--bar:#24272c;--bar2:#1e2227;--tx:#e8e8e8;--dim:#8b9099;--line:#34383f;--ac:#3b6fd6;--cur:#2e3446;--gut:#2a2e39;--menu:#23272c;--fs:14px;--lh:20px;--mono:"JetBrains Mono","Fira Code",Menlo,Consolas,"DejaVu Sans Mono",monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bar);color:var(--tx);font-family:system-ui,"Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
svg{fill:currentColor;display:block}
#app{position:fixed;left:0;right:0;top:0;height:100%;display:flex;flex-direction:column;direction:ltr}
#top{height:48px;background:var(--bar);display:flex;align-items:center;padding:0 4px;flex:none}
.ib{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;border-radius:50%;flex:none;color:#fff}
.ib svg{width:24px;height:24px}
.ib:active{background:#ffffff22}
.ttl{flex:1;min-width:0;padding:0 8px}
.ttl b{display:block;font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.ttl small{display:block;font-size:12px;color:var(--dim);direction:rtl;text-align:left;line-height:1.2}
.pill{height:32px;border:0;border-radius:16px;padding:0 10px;margin:0 4px;background:linear-gradient(135deg,#ec4899,#8b5cf6);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;gap:5px;flex:none}
.pill svg{width:18px;height:18px}
.pill:active{filter:brightness(.85)}
#tabs{display:flex;height:34px;background:var(--bar);overflow-x:auto;flex:none;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-width:118px;max-width:190px;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:15px;border-top:2px solid transparent;color:#cfd2d8;position:relative}
.tab.on{border-top-color:var(--ac);background:var(--bar2);color:#fff}
.tab .dot{width:6px;height:6px;border-radius:50%;background:#ffd600;flex:none;visibility:hidden}
.tab.d .dot{visibility:visible}
.tab .fi{width:18px;height:18px;flex:none}
.tab .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .x{width:20px;height:20px;border:0;background:none;color:#fff;padding:0;flex:none}
.tab .x svg{width:20px;height:20px}
#findbar{background:var(--bar);padding:6px;display:none;flex-direction:column;gap:6px;flex:none;border-top:1px solid var(--line);direction:rtl}
#findbar.open{display:flex}
#findbar .r{display:flex;gap:6px;align-items:center}
#findbar input{flex:1;min-width:0;height:36px;border-radius:8px;border:1px solid var(--line);background:#1b1e22;color:#fff;padding:0 10px;font:inherit;font-size:15px;outline:0}
#findbar input:focus{border-color:var(--ac)}
#findbar button.s{height:36px;min-width:36px;padding:0 10px;border-radius:8px;border:0;background:#33373f;color:#fff;font-size:13px}
#findbar button.s svg{width:20px;height:20px;margin:auto}
#findcount{font-size:12px;color:var(--dim);min-width:38px;text-align:center}
#ed{flex:1;display:flex;min-height:0;background:var(--bg);position:relative}
#gutter{flex:none;width:46px;background:var(--gut);overflow:hidden;color:#6f7685;font:var(--fs)/var(--lh) var(--mono);text-align:center;position:relative}
#gin{padding-top:8px;white-space:pre;will-change:transform}
#wrap{position:relative;flex:1;min-width:0;overflow:hidden}
#cur{position:absolute;left:0;right:0;height:var(--lh);background:var(--cur);pointer-events:none}
.code{font:var(--fs)/var(--lh) var(--mono);letter-spacing:0;tab-size:2;-moz-tab-size:2;white-space:pre;padding:8px 14px 160px 8px;margin:0;border:0;direction:ltr;text-align:left;font-variant-ligatures:none;word-spacing:0;text-rendering:auto}
#hl{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;pointer-events:none;color:#abb2bf}
#ta{position:absolute;left:0;top:0;width:100%;height:100%;background:transparent;color:transparent;caret-color:#fff;resize:none;outline:0;overflow:auto;-webkit-text-size-adjust:100%;border-radius:0}
#ta::selection{background:#3b6fd677}
.c-pn{color:#9aa3b2}.c-tg{color:#e06c75}.c-tu{color:#e5a06c}.c-at{color:#d19a66}.c-au{color:#c9b28a}.c-st{color:#98c379}
.c-cm{color:#7f848e;font-style:italic}.c-kw{color:#c678dd}.c-gl{color:#56b6c2}.c-fn{color:#61afef}.c-nm{color:#d19a66}
.c-pr{color:#56b6c2}.c-pu{color:#c9b28a}.c-vl{color:#98c379}.c-cl{color:#e5c07b}.c-id{color:#61afef}.c-ps{color:#c678dd}
#sugg{display:none;flex:none;background:#2d3139;overflow-x:auto;white-space:nowrap;padding:5px 6px;gap:6px;scrollbar-width:none;direction:rtl}
#sugg.open{display:flex}
#sugg::-webkit-scrollbar{display:none}
#sugg button{flex:none;border:0;background:#3a3f4a;color:#fff;border-radius:14px;padding:6px 14px;font-size:15px}
#sugg button:active{background:var(--ac)}
#qt{flex:none;background:var(--bar);height:92px;position:relative;touch-action:manipulation}
.qr{display:none;height:46px}
.qr.on{display:flex}
.qb{flex:1;border:0;background:none;color:#fff;font-weight:600;font-size:14px;display:grid;place-items:center;position:relative;padding:0;min-width:0}
.qb svg{width:24px;height:24px}
.qb:active{background:#ffffff1c}
.qb.act{color:#6ea0ff;background:#ffffff14}
.qb.dis{opacity:.4}
.qb .sm{font-size:11px;position:absolute;margin-left:12px;margin-top:6px}
.qb.sy{font-size:20px;font-weight:500;font-family:var(--mono)}
.qb.sn{font-size:13px;font-weight:600;direction:rtl;white-space:nowrap}
#svdot{position:absolute;top:3px;right:50%;margin-right:-18px;width:7px;height:7px;border-radius:50%;background:#ffd600;display:none}
#fab{position:absolute;right:16px;bottom:100px;width:46px;height:46px;border-radius:50%;border:2px solid #fff;background:#24272ccc;display:grid;place-items:center;color:#fff;z-index:5;box-shadow:0 2px 10px #0008}
#fab svg{width:26px;height:26px;transition:transform .2s}
#fab.up svg{transform:rotate(180deg)}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#101215;color:#fff;border-radius:20px;padding:10px 18px;font-size:14px;z-index:99;display:none;max-width:90%;box-shadow:0 4px 16px #000a;align-items:center;gap:12px;direction:rtl}
#toast.show{display:flex}
#toast button{border:0;background:none;color:#6ea0ff;font-weight:700;font-size:14px;padding:0}
.shade{position:fixed;left:0;top:0;right:0;bottom:0;z-index:48;background:transparent}
.menu{position:fixed;background:var(--menu);border-radius:6px;box-shadow:0 8px 28px #000c;min-width:250px;max-width:90%;max-height:82%;overflow:auto;z-index:50;direction:ltr}
.mi{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 16px;min-height:52px;font-size:16px;text-align:left;width:100%;border:0;background:none;color:#fff}
.mi:active{background:#ffffff14}
.mi .lb{flex:1;min-width:0}
.mi small{display:block;color:var(--dim);font-size:13px;margin-top:1px}
.mi svg{width:22px;height:22px;flex:none}
.mi.off{color:#6d727b}
.mi.off small{color:#5a5f68}
.msep{height:1px;background:#3b4048;margin:0}
.chk{width:30px;height:30px;border:2px solid #cfd2d8;border-radius:6px;flex:none;display:grid;place-items:center}
.chk.on{background:var(--ac);border-color:var(--ac)}
.chk.on::after{content:"";width:8px;height:15px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
#drawer{position:fixed;left:0;top:0;right:0;bottom:0;z-index:40;display:none;direction:ltr}
#drawer.open{display:block}
#dscrim{position:absolute;left:0;top:0;right:0;bottom:0;background:#0009}
#dpanel{position:absolute;left:0;top:0;bottom:0;width:min(90%,360px);display:flex;background:var(--menu);box-shadow:4px 0 24px #000a}
#rail{width:54px;background:var(--bar2);display:flex;flex-direction:column;align-items:center;padding-top:8px;flex:none;position:relative}
#rail .rb{width:44px;height:44px;border:0;background:none;color:#8d929b;border-radius:12px;display:grid;place-items:center;margin:4px 0;position:relative}
#rail .rb svg{width:26px;height:26px}
#rail .rb.on{background:#13161a;color:#fff}
#rail .rb.on::before{content:"";position:absolute;left:-5px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:#fff}
#rail .av{margin-top:auto;border-top:1px solid #333;width:100%;padding:10px 0;display:grid;place-items:center}
#rail .av button{border:0;background:none;color:#9aa0a8;padding:0}
#rail .av svg{width:38px;height:38px}
#pbody{flex:1;min-width:0;display:flex;flex-direction:column;direction:rtl}
.ph{display:flex;align-items:center;padding:12px 14px 8px;gap:4px}
.ph h3{flex:1;margin:0;font-size:19px;font-weight:600}
.ph .ib{width:38px;height:38px}
.pin{margin:4px 14px 10px;height:44px;border-radius:10px;border:1px solid #4a4f58;background:transparent;color:#fff;padding:0 12px;font:inherit;font-size:16px;outline:0;width:calc(100% - 28px)}
.pin:focus{border-color:var(--ac)}
.plist{flex:1;overflow:auto;border-top:1px solid #353a41}
.pi{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #2c3036;width:100%;border-left:0;border-right:0;border-top:0;background:none;color:#fff;text-align:right}
.pi:active{background:#ffffff12}
.pi .fi{width:22px;height:22px;flex:none}
.pi .t{flex:1;min-width:0}
.pi .t b{display:block;font-weight:500;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:right}
.pi .t small{color:var(--dim);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi .ib{width:34px;height:34px;color:#aaa}
.grp{padding:10px 14px;font-size:14px;color:#9aa0a8;background:#1f2327;border-bottom:1px solid #2c3036;display:flex;justify-content:space-between;width:100%;border-left:0;border-right:0;border-top:0;text-align:right}
.ri{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;border-bottom:1px solid #2a2e33;width:100%;border-left:0;border-right:0;border-top:0;background:none;color:#fff;gap:10px}
.ri:active{background:#ffffff12}
.ri .a{font-size:16px;text-align:right}
.ri .e{font-family:var(--mono);font-size:13px;color:#98c379;direction:ltr;text-align:left}
.sr{padding:8px 14px;border-bottom:1px solid #2a2e33;font-size:13px;color:#cfd2d8;width:100%;border-left:0;border-right:0;border-top:0;background:none;text-align:right}
.sr b{color:#fff;font-size:15px;display:block;direction:ltr;text-align:right}
.sr code{display:block;direction:ltr;text-align:left;font-family:var(--mono);color:#9aa3b2;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:24px;color:var(--dim);text-align:center;font-size:14px}
.btnrow{display:flex;gap:8px;padding:8px 14px}
.btnrow button{flex:1;height:40px;border-radius:10px;border:0;background:#33373f;color:#fff;font-size:14px}
#dlg{position:fixed;left:0;top:0;right:0;bottom:0;z-index:70;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;direction:rtl}
#dlg.open{display:flex}
#dlg .card{background:var(--menu);border-radius:14px;width:100%;max-width:420px;max-height:88%;overflow:auto;padding:18px 18px 12px;box-shadow:0 10px 40px #000}
.card h4{margin:0 0 10px;font-size:18px}
.card p{margin:6px 0;line-height:1.7;font-size:15px;color:#d5d8de}
.card input[type=text],.card textarea{width:100%;height:44px;border-radius:10px;border:1px solid #4a4f58;background:#1b1e22;color:#fff;padding:0 12px;font:inherit;font-size:16px;outline:0;margin:6px 0}
.card input[type=text]:focus{border-color:var(--ac)}
.card .acts{display:flex;gap:8px;justify-content:flex-start;margin-top:12px;flex-wrap:wrap}
.card .acts button{border:0;border-radius:10px;padding:10px 16px;background:#33373f;color:#fff;font-size:15px}
.card .acts button.p{background:var(--ac)}
.card .acts button.dz{background:#c0392b}
.card .opt{display:flex;width:100%;align-items:center;gap:12px;padding:13px 10px;border:0;border-radius:10px;background:#2b2f36;color:#fff;margin:6px 0;text-align:right;font-size:16px}
.card .opt small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.card .opt svg{width:24px;height:24px;flex:none;color:#8fb3ff}
.fld{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #31353c;font-size:15px}
.fld input[type=range]{width:50%}
.fld input[type=text]{width:50%;height:38px;margin:0;direction:ltr}
.sw{width:46px;height:26px;border-radius:13px;background:#4a4f58;position:relative;border:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.sw.on{background:var(--ac)}
.sw.on::after{transform:translateX(20px)}
#pv{position:fixed;left:0;top:0;right:0;bottom:0;z-index:60;background:#fff;display:none;flex-direction:column;direction:ltr}
#pv.open{display:flex}
#pvbar{height:48px;background:var(--bar);display:flex;align-items:center;padding:0 4px;color:#fff;flex:none}
#pvbar .t{flex:1;padding:0 8px;font-weight:600;direction:rtl;text-align:left}
#pvf{flex:1;border:0;background:#fff;width:100%}
#pvc{display:none;height:38%;background:#16191d;color:#e8e8e8;flex-direction:column;border-top:2px solid var(--ac);flex:none}
#pvc.open{display:flex}
#pvch{display:flex;align-items:center;justify-content:space-between;padding:4px 10px;background:#1e2227;font-size:13px;direction:rtl}
#pvch button{border:0;background:none;color:#6ea0ff;font-size:13px}
#pvl{flex:1;overflow:auto;font:12.5px/1.5 var(--mono);padding:6px 10px;direction:ltr;text-align:left}
#pvl div{padding:2px 0;border-bottom:1px solid #22262b;white-space:pre-wrap;word-break:break-word}
#pvl .error{color:#ff7b72}#pvl .warn{color:#e5c07b}
#ai{position:fixed;left:0;top:0;right:0;bottom:0;z-index:55;background:var(--bar);display:none;flex-direction:column;direction:rtl}
#ai.open{display:flex}
#aih{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--bar2);flex:none}
#aih h3{flex:1;margin:0;font-size:18px}
#aim{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:94%;padding:10px 13px;border-radius:14px;line-height:1.85;font-size:15px;word-break:break-word}
.bub.u{align-self:flex-start;background:var(--ac);color:#fff;border-bottom-right-radius:4px}
.bub.a{align-self:flex-end;background:#2d3139;border-bottom-left-radius:4px;width:94%}
.bub code{background:#00000055;padding:1px 6px;border-radius:5px;font-family:var(--mono);font-size:13px;direction:ltr;display:inline-block}
.cb{background:#1b1e24;border-radius:10px;margin:8px 0;overflow:hidden;direction:ltr}
.cbh{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;background:#23272f;font-size:12px;color:#9aa3b2;font-family:var(--mono)}
.cbh span{display:flex;gap:6px}
.cbh button{border:0;border-radius:6px;background:#3a3f4a;color:#fff;padding:3px 9px;font-size:12px;font-family:system-ui,sans-serif}
.cb pre{margin:0;padding:10px;overflow-x:auto;font:12.5px/1.6 var(--mono);color:#abb2bf;white-space:pre;tab-size:2}
#aic{display:flex;gap:6px;overflow-x:auto;padding:6px 8px;flex:none;scrollbar-width:none}
#aic::-webkit-scrollbar{display:none}
#aic button{flex:none;border:1px solid #444a54;background:#2a2e35;color:#dfe3ea;border-radius:16px;padding:6px 12px;font-size:13px}
#aif{display:flex;gap:6px;padding:8px;background:var(--bar2);flex:none;align-items:flex-end}
#aif textarea{flex:1;min-height:44px;max-height:120px;border-radius:14px;border:1px solid #444a54;background:#1b1e22;color:#fff;padding:10px 12px;font:inherit;font-size:16px;outline:0;resize:none}
#aif .ib{background:var(--ac);width:44px;height:44px;flex:none}
.typing{display:inline-block;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
@media (min-width:700px){#app,#pv,#ai{max-width:760px;left:50%;transform:translateX(-50%)}}

</style>

<body>
<div id="app">
  <header id="top">
    <button class="ib" id="bMenu" aria-label="القائمة"></button>
    <div class="ttl"><b id="fT">index.html</b><small id="fS">ملف جديد</small></div>
    <button class="pill" id="bConv" aria-label="حوّل للإنجليزي"></button>

<script>
var NERO = (function () {
'use strict';

/* ============ تطبيع الكلمات العربية ============ */
const TASH = /[\u064B-\u065F\u0670\u0640]/g;
function d2a(s) {
  return s.replace(/[٠-٩]/g, d => String(d.charCodeAt(0) - 1632)).replace(/[۰-۹]/g, d => String(d.charCodeAt(0) - 1776));
}
function norm(s) {
  return d2a(String(s).replace(TASH, ''))
    .replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')
    .replace(/_/g, '-').toLowerCase();

const fb = $('#findbar'), fIn = $('#fIn'), rIn = $('#rIn');

function allMatches() {

const qt = $('#qt');
const PAGES = [];

function helpDlg() {
  info('كيف تستخدم نيرو', `
<p><b>1.</b> اكتب كودك بالعربي (مثلاً <code style="direction:ltr;display:inline-block">&lt;قسم&gt;</code> و <code>لون: احمر;</code>).</p>
<p><b>2.</b> اضغط زر <b>EN</b> الملون فوق، فيتحول كودك لإنجليزي حقيقي.</p>
<p><b>3.</b> زر ▶ يشغّل الصفحة (يحوّل تلقائياً ويعرضها).</p>
<p><b>4.</b> الكلمات الغير معروفة تنترك كما هي، فتقدر تخلط عربي وإنجليزي.</p>
<p><b>5.</b> من القائمة الجانبية: <b>مرجع الكلمات</b> فيه كل الكلمات، و<b>المعلم</b> يعلمك خطوة بخطوة.</p>
<p>قواعد سريعة: الوسوم <code>&lt;قسم&gt;</code> · الخصائص <code>فئة="…"</code> · CSS <code>حجم-الخط: 20بكسل;</code> · JS <code>دالة</code> <code>اذا</code> <code>اطبع()</code>.</p>
<p>العنوان الكبير <code>&lt;عنوان&gt;</code> = h1، وعنوان الصفحة <code>&lt;عنوان_الصفحة&gt;</code> = title.</p>`);
}

/* ===== المعاينة ===== */
const CAP = '<script>(function(){var p=function(t,a){try{parent.postMessage({nero:1,t:t,m:Array.prototype.map.call(a,function(x){try{return typeof x==="object"?JSON.stringify(x):String(x)}catch(e){return String(x)}}).join(" ")},"*")}catch(e){}};["log","info","warn","error"].forEach(function(k){var o=console[k];console[k]=function(){p(k,arguments);try{o.apply(console,arguments)}catch(e){}}});window.addEventListener("error",function(e){p("error",[e.message+" (سطر "+e.lineno+")"])});window.addEventListener("unhandledrejection",function(e){p("error",[String(e.reason)])});["localStorage","sessionStorage"].forEach(function(n){try{window[n].getItem("x")}catch(e){var m={};try{Object.defineProperty(window,n,{configurable:true,value:{getItem:function(k){return k in m?m[k]:null},setItem:function(k,v){m[k]=String(v)},removeItem:function(k){delete m[k]},clear:function(){m={}},key:function(i){return Object.keys(m)[i]||null},get length(){return Object.keys(m).length}}})}catch(e2){}}})})();<\/script>';
let pvCode = '';
function runPreview(showConsole) {
  const f = cur(), k = kind(f);
  if (k !== 'html') { toast('التشغيل متاح لملفات HTML'); return; }
  let code = N.convert(ta.value, 'html');
  if (/<head[^>]*>/i.test(code)) code = code.replace(/<head[^>]*>/i, m => m + CAP);
  else if (/<!doctype[^>]*>/i.test(code)) code = code.replace(/<!doctype[^>]*>/i, m => m + CAP);
  else code = CAP + code;
  pvCode = code; $('#pvl').innerHTML = '';
  $('#pvf').srcdoc = code;
  $('#pv').classList.add('open');
  $('#pvc').classList.toggle('open', !!showConsole === true);
}
function closePreview() { $('#pv').classList.remove('open'); $('#pvf').srcdoc = ''; }
window.addEventListener('message', e => {
  const d = e.data; if (!d || !d.nero) return;
  const l = $('#pvl'), row = document.createElement('div'); row.className = d.t; row.textContent = d.m; l.appendChild(row); l.scrollTop = l.scrollHeight;
  if (d.t === 'error') $('#pvc').classList.add('open');
});

/* ===== المعلم الذكي (Puter - مجاني بدون API) ===== */
const SYS = 'أنت «معلم نيرو»، معلم برمجة ودود يشرح بالعربي البسيط (يمكنك استخدام لمسة عراقية خفيفة). نيرو محرر يسمح بكتابة HTML وCSS وJavaScript بكلمات عربية، وبضغطة زر يحوّلها لكود إنجليزي حقيقي. هدفك أن تعلّم المستخدم البرمجة خطوة بخطوة، وتربط دائماً بين الكلمة العربية ومقابلها الإنجليزي لأن هذا هو الكود الحقيقي.\n' +
  'قواعد: 1) في الأمثلة استخدم فقط كلمات القاموس أدناه بالضبط، وإذا لم توجد كلمة عربية اكتب الكلمة الإنجليزية كما هي. 2) ضع الكود داخل ```html أو ```css أو ```js. 3) بعد المثال العربي اعرض النسخة الإنجليزية الناتجة باختصار. 4) اجعل الشرح قصيراً ومركزاً وخطوة خطوة، واقترح تمريناً صغيراً. 5) صيغة الكود: الوسوم <قسم>…</قسم>، الخصائص فئة="س"، CSS: جسم { لون: احمر; حجم-الخط: 20بكسل; }، JS: دالة اسم() { اذا (س > 1) { اطبع("مرحبا") } }. العنوان الكبير <عنوان> = h1 وعنوان الصفحة <عنوان_الصفحة> = title.\n\nالقاموس:\n' + N.promptDict();
let chat = [], busy = false;
const aim = $('#aim');
function openAI() {
  $('#ai').classList.add('open');
  if (!aim.children.length) addBub('a', 'أهلاً! أنا معلم نيرو 👋\nاسألني أي شي عن البرمجة بالعربي، أو اضغط على أحد الأزرار تحت. أكتب لك أمثلة بكلمات عربية وأوضح لك مقابلها الإنجليزي.');
  renderChips();
}
function closeAI() { $('#ai').classList.remove('open'); }
function md(text) {
  if ((text.match(/```/g) || []).length % 2) text += '\n```';
  const parts = text.split(/```/); let html = '';
  parts.forEach((p, i) => {
    if (i % 2 === 0) {
      html += escH(p).replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>').replace(/^#{1,4}\s*(.+)$/gm, '<b>$1</b>').replace(/\n/g, '<br>');
    } else {
      const m = /^([\w+-]*)\n?([\s\S]*)$/.exec(p); const lang = (m[1] || '').toLowerCase(), code = m[2].replace(/\n$/, '');
      const k = lang === 'html' ? 'html' : lang === 'css' ? 'css' : (lang === 'js' || lang === 'javascript') ? 'js' : 'text';
      html += '<div class="cb" data-i="' + i + '"><div class="cbh"><span><button data-a="copy">نسخ</button><button data-a="ins">ادرج بالمحرر</button></span><span>' + (lang || 'code') + '</span></div><pre>' + N.highlight(code, k) + '</pre></div>';
    }
  });
  return { html, parts };
}
function addBub(role, text) {
  const b = document.createElement('div'); b.className = 'bub ' + role;
  if (role === 'u') b.textContent = text; else fillBub(b, text);
  aim.appendChild(b); aim.scrollTop = aim.scrollHeight; return b;
}
function fillBub(b, text) {
  const r = md(text); b.innerHTML = r.html;
  b.querySelectorAll('.cb').forEach(cb => {
    const code = cb.querySelector('pre').textContent;
    cb.querySelector('[data-a=copy]').onclick = () => copyText(code);
    cb.querySelector('[data-a=ins]').onclick = () => { closeAI(); ta.focus(); insert(code); toast('أُدرج الكود بالمحرر'); };
  });
}
function renderChips() {
  const c = $('#aic'); c.innerHTML = '';
  [['اشرح الكود الحالي', 'اشرح لي هذا الكود سطر بسطر وبشكل بسيط، ووضح مقابل كل كلمة عربية بالإنجليزي:', true],
   ['لاقي الأخطاء', 'راجع هذا الكود ودلني على الأخطاء وصححها:', true],
   ['علمني HTML من الصفر', 'علمني HTML من الصفر خطوة بخطوة بكلمات نيرو العربية، ابدأ بالدرس الأول فقط.'],
   ['علمني CSS', 'علمني CSS من الصفر بكلمات نيرو العربية، ابدأ بالدرس الأول فقط.'],
   ['علمني JavaScript', 'علمني JavaScript من الصفر بكلمات نيرو العربية، ابدأ بالدرس الأول فقط.'],
   ['اعطني تمرين', 'اعطني تمرين صغير مناسب لمستواي بكلمات نيرو العربية.'],
   ['شلون أسوي زر؟', 'شلون أسوي زر يسوي شي لما أضغط عليه؟ بكلمات نيرو العربية.']
  ].forEach(([t, q, withCode]) => {
    const b = document.createElement('button'); b.textContent = t;
    b.onclick = () => send(q + (withCode ? '\n```\n' + ta.value.slice(0, 6000) + '\n```' : ''), t);
    c.appendChild(b);
  });
}
function extract(r) {
  if (typeof r === 'string') return r;
  const c = r && r.message && r.message.content;
  if (typeof c === 'string') return c;
  if (Array.isArray(c)) return c.map(x => x.text || '').join('');
  return (r && r.text) || '';
}
async function send(q, shown) {
  if (busy) return;
  q = (q || '').trim(); if (!q) return;
  if (typeof puter === 'undefined' || !puter.ai) { addBub('u', shown || q); addBub('a', 'ما قدرت أتصل بالذكاء الاصطناعي ❌\nتأكد من الإنترنت وارجع جرب.'); return; }
  busy = true; $('#aiSend').style.opacity = .5;
  addBub('u', shown || q);
  chat.push({ role: 'user', content: q }); if (chat.length > 10) chat = chat.slice(-10);
  const bub = addBub('a', ''); bub.innerHTML = '<span class="typing">…</span>';
  let acc = '';
  try {
    const msgs = [{ role: 'system', content: SYS }].concat(chat);
    const r = await puter.ai.chat(msgs, { model: S.set.model || 'gpt-4o-mini', stream: true });
    if (r && typeof r[Symbol.asyncIterator] === 'function') {
      for await (const part of r) { acc += (part && part.text) || ''; fillBub(bub, acc); aim.scrollTop = aim.scrollHeight; }
    } else { acc = extract(r); fillBub(bub, acc); }
    if (!acc.trim()) throw new Error('empty');
    chat.push({ role: 'assistant', content: acc });
  } catch (e) {
    const msg = (e && (e.message || (e.error && e.error.message))) || '';
    fillBub(bub, acc || ('صار خطأ بالاتصال بالمعلم ❌\nتأكد من الإنترنت، ولو طلب منك تسجيل دخول Puter (مجاني) سجّل وارجع جرب.' + (msg ? '\n(' + msg + ')' : '')));
    chat.pop();
  }
  busy = false; $('#aiSend').style.opacity = 1; aim.scrollTop = aim.scrollHeight;
}
$('#aiSend').onclick = () => { const i = $('#aiIn'); const v = i.value; i.value = ''; send(v); };
$('#aiIn').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $('#aiSend').click(); } });

/* ===== ربط الأزرار ===== */
function wire() {
  $('#bMenu').innerHTML = svg('menu'); $('#bMenu').onclick = () => openDrawer();
  $('#bConv').innerHTML = svg('trans') + 'EN'; $('#bConv').onclick = convertDlg;
  $('#bEdit').innerHTML = svg('edit'); $('#bEdit').onclick = mainMenu;
  $('#bRun').innerHTML = svg('play'); $('#bRun').onclick = () => runPreview(false);
  $('#bMore').innerHTML = svg('more'); $('#bMore').onclick = fileMenu;
  $('#fPrev').innerHTML = svg('up'); $('#fNext').innerHTML = svg('down'); $('#fX').innerHTML = svg('close');
  $('#fPrev').onclick = () => findStep(-1); $('#fNext').onclick = () => findStep(1); $('#fX').onclick = () => toggleFind(false);
  $('#rOne').onclick = replaceOne; $('#rAll').onclick = replaceAll;
  $('#fab').innerHTML = svg('down');
  $('#pvX').innerHTML = svg('close'); $('#pvX').onclick = closePreview;
  $('#pvR').innerHTML = svg('refresh'); $('#pvR').onclick = () => { $('#pvl').innerHTML = ''; $('#pvf').srcdoc = pvCode; };
  $('#pvC').innerHTML = svg('term'); $('#pvC').onclick = () => $('#pvc').classList.toggle('open');
  $('#pvClr').onclick = () => { $('#pvl').innerHTML = ''; };
  $('#aiX').innerHTML = svg('close'); $('#aiX').onclick = closeAI;
  $('#aiClr').innerHTML = svg('trash'); $('#aiClr').onclick = () => { chat = []; aim.innerHTML = ''; openAI(); };
  $('#aiSend').innerHTML = svg('send');
}
function fitViewport() {
  const vv = window.visualViewport, app = $('#app');
  const h = vv ? vv.height : window.innerHeight;
  app.style.height = h + 'px'; app.style.top = (vv ? vv.offsetTop : 0) + 'px';
  setTimeout(() => { reveal(ta.selectionStart); }, 50);
}
if (window.visualViewport) { window.visualViewport.addEventListener('resize', fitViewport); window.visualViewport.addEventListener('scroll', fitViewport); }
window.addEventListener('resize', fitViewport);
window.addEventListener('beforeunload', () => { const f = cur(); if (f) { f.content = ta.value; f.sel = [ta.selectionStart, ta.selectionEnd]; f.top = ta.scrollTop; } persist(true); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { const f = cur(); if (f) { f.content = ta.value; } persist(true); } });
window.addEventListener('error', e => { try { console.error(e.message); } catch (x) {} });

load(); applyFont(); wire(); buildQT(); renderQT(); fitViewport(); loadFile(S.active);
window.NeroApp = { S, convertDlg, runPreview, loadFile, cur, commit, send, openAI, openDrawer, settingsDlg, mainMenu, fileMenu, undo, redo, saveFile, moveLines, copyLines, indent, moveCaret, insertSnippet, toggleFind, findStep, formatCode };
})();
