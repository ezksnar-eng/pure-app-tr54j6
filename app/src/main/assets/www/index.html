<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مخصص أيقونات الأيفون</title>
    <!-- استخدام Tailwind CSS للتصميم السريع والاحترافي -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #1e293b 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
            min-height: 100vh;
        }
        /* شكل أيقونة الأيفون الحقيقية (Squircle) */
        .ios-icon {
            width: 76px;
            height: 76px;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .ios-icon:hover {
            transform: scale(1.05);
        }
        .ios-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body class="p-4 sm:p-8 flex flex-col items-center justify-center">

    <div class="w-full max-w-md bg-white/10 backdrop-blur-lg border border-white/20 rounded-3xl p-6 shadow-2xl">
        <h1 class="text-2xl font-bold text-center mb-2">تخصيص أيقونات الأيفون</h1>
        <p class="text-gray-300 text-center text-sm mb-6">غير اسم أي تطبيق وصورته على ذوقك وبكل سهولة</p>

        <!-- نموذج الإدخال -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1 text-gray-200">اسم التطبيق الجديد</label>
                <input type="text" id="appNameInput" placeholder="مثال: انستغرام السري" 
                    class="w-full px-4 py-3 bg-black/40 border border-white/20 rounded-xl focus:outline-none focus:border-indigo-500 text-white placeholder-gray-400">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1 text-gray-200">رابط التطبيق أو الأكشن (URL)</label>
                <input type="text" id="appUrlInput" placeholder="https://instagram.com" 
                    class="w-full px-4 py-3 bg-black/40 border border-white/20 rounded-xl focus:outline-none focus:border-indigo-500 text-white placeholder-gray-400 text-left" dir="ltr">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1 text-gray-200">اختر صورة الأيقونة</label>
                <input type="file" id="imageInput" accept="image/*" 
                    class="w-full text-sm text-gray-300 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 cursor-pointer">
            </div>

            <button onclick="generateShortcut()" 
                class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-bold rounded-xl transition duration-200 shadow-lg shadow-indigo-600/30">
                معاينة الاختصار
            </button>
        </div>

        <!-- قسم المعاينة (شبه شاشة الأيفون) -->
        <div class="mt-8 pt-6 border-t border-white/10 flex flex-col items-center">
            <h2 class="text-sm font-semibold text-gray-400 mb-4">معاينة الأيقونة على الشاشة الرئيسية</h2>
            <div id="previewContainer" class="flex flex-col items-center cursor-pointer">
                <div class="ios-icon mb-2">
                    <img id="previewImg" src="https://via.placeholder.com/150/1e293b/ffffff?text=App" alt="Icon">
                </div>
                <span id="previewName" class="text-xs font-medium text-white drop-shadow">اسم التطبيق</span>
            </div>
        </div>

        <div id="actionBox" class="mt-6 hidden">
            <p class="text-xs text-center text-gray-300 mb-3">لإضافته كاختصار حقيقي لشاشتك، افتح هذه الصفحة من متصفح سفاري (للايفون) أو كروم (للاندرويد) وأضف الصفحة إلى الشاشة الرئيسية (Add to Home Screen).</p>
            <a id="launchLink" href="#" target="_blank" class="block text-center py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-sm font-bold">
                تجربة فتح الرابط
            </a>
        </div>
    </div>

    <script>
        const appNameInput = document.getElementById('appNameInput');
        const appUrlInput = document.getElementById('appUrlInput');
        const imageInput = document.getElementById('imageInput');
        const previewName = document.getElementById('previewName');
        const previewImg = document.getElementById('previewImg');
        const actionBox = document.getElementById('actionBox');
        const launchLink = document.getElementById('launchLink');

        // تحديث الاسم مباشرة أثناء الكتابة
        appNameInput.addEventListener('input', (e) => {
            previewName.textContent = e.target.value || 'اسم التطبيق';
        });

        // قراءة الصورة المرفوعة وعرضها بالمعاينة
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    previewImg.src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        function generateShortcut() {
            const name = appNameInput.value.trim();
            const url = appUrlInput.value.trim();

            if(!name) {
                alert('يمعود اكتب اسم التطبيق أول شي!');
                return;
            }

            if(url) {
                launchLink.href = url.startsWith('http') ? url : 'https://' + url;
                actionBox.classList.remove('hidden');
            } else {
                launchLink.href = '#';
                actionBox.classList.add('hidden');
            }

            alert('تم توليد المعاينة بنجاح! تقدر تسوي لها إضافة للشاشة الرئيسية من خيارات المتصفح.');
        }
    </script>
</body>
</html>
