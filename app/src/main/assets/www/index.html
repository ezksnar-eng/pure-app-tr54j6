<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مخصص التطبيقات الحر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #09090b 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            min-height: 100vh;
        }
        .ios-icon {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ios-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body class="p-4 flex flex-col items-center justify-center">

    <div class="w-full max-w-md bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl p-6 shadow-2xl">
        <h1 class="text-2xl font-bold text-center mb-2">تخصيص أيقونات التطبيقات</h1>
        <p class="text-gray-300 text-center text-xs mb-6">اكتب اسم التطبيق وحزمة الأندرويد مالته وافتحه بكل حرية!</p>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-medium mb-1 text-gray-200">اسم التطبيق الجديد</label>
                <input type="text" id="appName" placeholder="مثلاً: يوتيوب السري" value="تطبيقي"
                    class="w-full px-4 py-3 bg-black/40 border border-white/25 rounded-xl focus:outline-none focus:border-pink-500 text-white text-sm">
            </div>

            <div>
                <label class="block text-xs font-medium mb-1 text-gray-200">حزمة التطبيق (Package Name)</label>
                <input type="text" id="packageInput" placeholder="مثل: com.google.android.youtube" dir="ltr"
                    class="w-full px-4 py-3 bg-black/40 border border-white/25 rounded-xl focus:outline-none focus:border-pink-500 text-white text-sm text-left">
                <p class="text-[10px] text-gray-400 mt-1">ملاحظة: تلكى اسم الحزمة من رابط متصفح متجر بلي بعد id=</p>
            </div>

            <div>
                <label class="block text-xs font-medium mb-1 text-gray-200">صورة الأيقونة المخصصة</label>
                <input type="file" id="imageInput" accept="image/*" 
                    class="w-full text-xs text-gray-300 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-pink-600 file:text-white hover:file:bg-pink-500 cursor-pointer">
            </div>

            <button onclick="launchCustomApp()" 
                class="w-full py-3.5 bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 font-bold rounded-xl transition duration-200 shadow-lg shadow-pink-600/30 text-sm">
                فتح التطبيق مباشرة 🚀
            </button>
        </div>

        <!-- المعاينة -->
        <div class="mt-6 pt-6 border-t border-white/10 flex flex-col items-center">
            <span class="text-xs text-gray-400 mb-3">معاينة الأيقونة</span>
            <div class="ios-icon mb-2">
                <img id="previewImg" src="https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png" alt="Icon">
            </div>
            <span id="previewName" class="text-xs font-bold text-white">تطبيقي</span>
        </div>
    </div>

    <script>
        const appNameInput = document.getElementById('appName');
        const packageInput = document.getElementById('packageInput');
        const imageInput = document.getElementById('imageInput');
        const previewName = document.getElementById('previewName');
        const previewImg = document.getElementById('previewImg');

        appNameInput.addEventListener('input', (e) => {
            previewName.textContent = e.target.value || 'تطبيق';
        });

        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    previewImg.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        function launchCustomApp() {
            const pkg = packageInput.value.trim();
            if (!pkg) {
                alert('يمعود اكتب حزمة التطبيق أول شي (Package Name)!');
                return;
            }

            // استخدام طريقة الـ Intent المباشرة بدون تحويل إجباري لمتجر بلي
            const intentUrl = `intent://launch#Intent;package=${pkg};scheme=https;end`;
            window.location.href = intentUrl;
        }
    </script>
</body>
</html>
